  // =============================== tutorial ===============================
  startTutorial() {
    const keep = this.difficulty;
    this.difficulty = "Easy";
    this.newGame();
    this.difficulty = keep;
    this.res = { atp: 300, bio: 300 };
    this.alerts = [];
    this.tut = { i: -1, t: 0, seen: new Set(), notes: [], ghost: null, ghost_t: 0, centered: false,
                 cam0: [this.cam_x, this.cam_y], demo_started: false, pan_t: -99 };
    this.tutGo(0);
  }
  tutGo(i) {
    const tut = this.tut;
    if (!tut) return;
    if (i >= TUTORIAL_STEPS.length) { this.endTutorial(true); return; }
    tut.i = i; tut.t = 0; tut.ghost = null; tut.ghost_t = 0; tut.centered = false;
    const s = TUTORIAL_STEPS[i];
    if (s.card) { this.build_key = null; this.clearSelection(); }
    if (s.enter) s.enter(this);
  }
  endTutorial(finished) {
    this.tut = null;
    this.tut_done = true;
    try { localStorage.setItem(TUT_KEY, "1"); } catch (_) { /* storage blocked */ }
    if (finished) {
      this.countdown = 75;
      this.alert("Tutorial done! The first real wave comes soon. More cells unlock as you clear waves.", GREEN);
    } else {
      this.alert("Tutorial skipped. Learn (main menu) explains every cell.", GREY);
    }
  }
  tutCard() { return !!(this.tut && TUTORIAL_STEPS[this.tut.i].card); }

  updateTutorial(dt) {
    const tut = this.tut;
    if (!tut) return;
    tut.t += dt;
    for (const n of tut.notes) { if (n.delay > 0) n.delay -= dt; else n.t -= dt; }
    tut.notes = tut.notes.filter(n => n.t > 0);
    const s = TUTORIAL_STEPS[tut.i];
    if (s.build) {
      tut.ghost_t -= dt;
      if (tut.ghost_t <= 0) { tut.ghost = this.suggestSpot(s.build); tut.ghost_t = 1.0; }
      // when the player picks the right card, bring the suggested spot into view
      if (this.build_key === s.build && !tut.centered && tut.ghost) {
        const sz = BUILDINGS[s.build].size * TILE;
        const [sx, sy] = this.w2s(tut.ghost[0] * TILE + sz / 2, tut.ghost[1] * TILE + sz / 2);
        if (!this.visible(sx, sy, -60)) this.centerOn(tut.ghost[0] * TILE + sz / 2, tut.ghost[1] * TILE + sz / 2);
        tut.centered = true;
      }
    }
    if (s.check && s.check(this)) this.tutGo(tut.i + 1);
  }

  /** A short label that pops up above something the first time it happens. */
  tutNote(key, x, y, text, color = WHITE, delay = 0) {
    const tut = this.tut;
    if (!tut || tut.seen.has(key)) return;
    tut.seen.add(key);
    tut.notes.push({ x, y, text, color, t: 4.5, delay });
    if (tut.notes.length > 4) tut.notes.shift();
    const [sx, sy] = this.w2s(x, y);
    if (!this.visible(sx, sy, -40) && this.time - tut.pan_t > 3) { this.centerOn(x, y); tut.pan_t = this.time; }
  }

  /** Best free spot near the Core for a building (capillaries: most vessel contact). */
  suggestSpot(key) {
    const d = BUILDINGS[key], s = d.size;
    const cgx = this.core_gx + 1.5, cgy = this.core_gy + 1.5;
    let best = null, bs = Infinity;
    for (let gy = Math.floor(cgy) - 12; gy <= cgy + 12; gy++) {
      for (let gx = Math.floor(cgx) - 14; gx <= cgx + 14; gx++) {
        const [ok, why] = this.canPlace(key, gx, gy);
        if (!ok && why !== "Not enough resources.") continue;
        let score = Math.hypot(gx + s / 2 - cgx, gy + s / 2 - cgy);
        if (d.supply) score -= this.vesselsTouching(gx, gy, s) * 0.8;
        // keep a free ring around it so paths stay open
        let crowded = false;
        for (let ty = gy - 1; ty <= gy + s && !crowded; ty++)
          for (let tx = gx - 1; tx <= gx + s; tx++)
            if (tx >= 0 && tx < MAP_W && ty >= 0 && ty < MAP_H && this.bgrid[ty][tx]) { crowded = true; break; }
        if (crowded) score += 5;
        if (score < bs) { bs = score; best = [gx, gy]; }
      }
    }
    return best;
  }

  /** The tutorial's practice attack: a few particles from a vessel close to the Core.
   *  It enters near some of the player's cells but away from the Swarm Nest, so the
   *  player gets to see a cell get infected and then killed - not only virus being eaten. */
  startDemoWave() {
    const ent = this.entries[this.next_entries[0]];
    const cx = this.core.x, cy = this.core.y;
    const hosts = this.buildings.filter(b => b !== this.core);
    const nests = this.buildings.filter(b => b.key === "neu_nest");
    let best = null, bs = -Infinity;
    for (let gy = 0; gy < MAP_H; gy++) {
      for (let gx = 0; gx < MAP_W; gx++) {
        if (this.tiles[gy][gx] !== T_VESSEL || this.bgrid[gy][gx]) continue;
        const x = (gx + 0.5) * TILE, y = (gy + 0.5) * TILE;
        const dc = Math.hypot(x - cx, y - cy) / TILE;
        if (dc < 7 || dc > 12) continue;
        const host = Math.min(...hosts.map(b => dist([x, y], [b.x, b.y])), 1e9);
        if (host > 230) continue;
        const nest = Math.min(...nests.map(b => dist([x, y], [b.x, b.y])), 1e9);
        const score = Math.min(nest, 600) - host * 0.5;
        if (score > bs) { bs = score; best = [x, y]; }
      }
    }
    if (!best) {
      const a = Math.atan2(ent.y - cy, ent.x - cx);
      best = [cx + Math.cos(a) * 9 * TILE, cy + Math.sin(a) * 9 * TILE];
    }
    this.entries.push({ name: "Nearby vessel", x: best[0], y: best[1], demo: true });
    const idx = this.entries.length - 1;
    this.demo_wave = true;
    this.wave_active = true;
    this.cur_strain = this.next_strain;
    this.active_entries = [idx];
    this.spawn_queue = new Array(8).fill(idx);
    this.spawn_t = 1.5;
    this.tut.demo_started = true;
    this.centerOn((best[0] + cx) / 2, (best[1] + cy) / 2);
  }

  worldRect(r, pad = 0) {
    return new Rect(r.x - Math.trunc(this.cam_x) - pad, r.y - Math.trunc(this.cam_y) + TOP_H - pad,
                    r.w + pad * 2, r.h + pad * 2);
  }

  /** Where the tutorial arrow should point right now. */
  tutTarget(s) {
    if (s.build) {
      const tab = TAB_ORDER.find(t => TABS[t].includes(s.build));
      const y0 = HEIGHT - BOTTOM_H;
      if (this.tab !== tab)
        return { rect: new Rect(10, y0 + 10 + TAB_ORDER.indexOf(tab) * 39, 100, 34), hint: "Click this tab" };
      if (this.build_key !== s.build) {
        const i = TABS[tab].indexOf(s.build);
        return { rect: new Rect(120 + i * 136, y0 + 10, 130, 114), hint: "Click this card" };
      }
      const g = this.tut.ghost;
      if (!g) return null;
      const sz = BUILDINGS[s.build].size * TILE;
      return { rect: this.worldRect(new Rect(g[0] * TILE, g[1] * TILE, sz, sz)), world: true, hint: "Click here" };
    }
    return s.point ? s.point(this) : null;
  }

  drawTutorial() {
    const tut = this.tut, s = TUTORIAL_STEPS[tut.i];
    if (s.card) {
      this.dim(190);
      const r = HOWTO_RECT;
      this.click_targets.push([new Rect(0, 0, WIDTH, HEIGHT), () => {}]);   // swallow clicks under the card
      this.panel(r);
      this.drawCard(HOWTO_CARDS.find(c => c.scene === s.card), r);
      this.text(`Tutorial ${tut.i + 1}/${TUTORIAL_STEPS.length}`, this.f_small, GREY, r.centerx, r.bottom - 92, "c");
      this.button([r.centerx - 120, r.bottom - 62, 240, 46], s.last ? "Start playing!" : "Next >",
                  () => this.tutGo(tut.i + 1), "primary", true, this.f_med);
      return;
    }
    const pulse = 0.5 + 0.5 * Math.sin(this.time * 5);
    ctx.save();
    ctx.beginPath(); ctx.rect(VIEW_RECT.x, VIEW_RECT.y, VIEW_RECT.w, VIEW_RECT.h); ctx.clip();
    if (s.vessels) {
      // make the blood vessels pulse so the player sees where capillaries go
      ctx.fillStyle = `rgba(255,110,130,${0.12 + 0.22 * pulse})`;
      const gx0 = Math.floor(this.cam_x / TILE), gy0 = Math.floor(this.cam_y / TILE);
      for (let gy = gy0; gy <= gy0 + Math.ceil(VIEW_H / TILE) + 1; gy++)
        for (let gx = gx0; gx <= gx0 + Math.ceil(VIEW_W / TILE) + 1; gx++)
          if (gx >= 0 && gx < MAP_W && gy >= 0 && gy < MAP_H && this.tiles[gy][gx] === T_VESSEL && !this.bgrid[gy][gx]) {
            const [sx, sy] = this.w2s(gx * TILE, gy * TILE);
            ctx.fillRect(sx, sy, TILE, TILE);
          }
    }
    if (s.build && tut.ghost) {
      const d = BUILDINGS[s.build], sz = d.size * TILE;
      const [sx, sy] = this.w2s(tut.ghost[0] * TILE, tut.ghost[1] * TILE);
      drawRect(ctx, css(d.color, 0.12 + 0.18 * pulse), new Rect(sx, sy, sz, sz), 0, 6);
      ctx.setLineDash([6, 5]);
      drawRect(ctx, WHITE, new Rect(sx, sy, sz, sz), 2, 6);
      ctx.setLineDash([]);
    }
    for (const n of tut.notes) {
      if (n.delay > 0) continue;
      const [sx, sy] = this.w2s(n.x, n.y);
      if (!this.visible(sx, sy, 0)) continue;
      ctx.globalAlpha = clamp(n.t / 0.6, 0, 1);
      const w = this.measure(n.text, this.f_bold) + 18;
      const bx = clamp(sx - w / 2, 6, VIEW_W - w - 6);
      let by = Math.max(TOP_H + 6, sy - 58);
      // don't hide the label under the caption box: flip it below the point instead
      const cap = tut.cap_rect;
      const below = cap && by < cap.bottom + 4 && bx < cap.right && bx + w > cap.x;
      if (below) by = sy + 30;
      drawLine(ctx, n.color, [clamp(sx, bx + 10, bx + w - 10), below ? by : by + 28], [sx, below ? sy + 6 : sy - 6], 2);
      drawCircle(ctx, n.color, [sx, sy], 5, 2);
      drawRect(ctx, "rgba(12,8,16,0.92)", new Rect(bx, by, w, 28), 0, 7);
      drawRect(ctx, n.color, new Rect(bx, by, w, 28), 2, 7);
      this.text(n.text, this.f_bold, n.color, bx + 9, by + 5);
      ctx.globalAlpha = 1;
    }
    ctx.restore();

    const tg = this.tutTarget(s);
    if (tg) {
      const R = tg.rect;
      const onScreen = tg.world ? R.colliderect(VIEW_RECT) : true;
      if (onScreen) {
        drawRect(ctx, css(YELLOW, 0.55 + 0.45 * pulse), R.inflate(8 + pulse * 6, 8 + pulse * 6), 3, 10);
        const down = R.y > TOP_H + 110;
        this.drawTutArrow(R.centerx, down ? R.y - 8 : R.bottom + 8, down ? 1 : -1, tg.hint);
      } else {
        // off screen: an arrow at the edge of the view pointing toward it
        const cx = VIEW_W / 2, cy = TOP_H + VIEW_H / 2;
        const a = Math.atan2(R.centery - cy, R.centerx - cx);
        const ex = clamp(cx + Math.cos(a) * 2000, 50, VIEW_W - 50);
        const ey = clamp(cy + Math.sin(a) * 2000, TOP_H + 110, TOP_H + VIEW_H - 50);
        drawPoly(ctx, YELLOW, [[ex + Math.cos(a) * 22, ey + Math.sin(a) * 22],
                               [ex + Math.cos(a + 2.4) * 18, ey + Math.sin(a + 2.4) * 18],
                               [ex + Math.cos(a - 2.4) * 18, ey + Math.sin(a - 2.4) * 18]]);
        this.scTag("This way", ex - Math.cos(a) * 34, ey - Math.sin(a) * 34 - 12, YELLOW);
      }
    }
    this.drawTutCaption(s);
  }

  drawTutArrow(tx, ty, dir, hint) {
    const bob = 4 + 8 * (0.5 + 0.5 * Math.sin(this.time * 6));
    const tipY = ty - dir * bob, baseY = tipY - dir * 22;
    const stem = new Rect(tx - 6, dir > 0 ? baseY - 22 : baseY, 12, 22);
    drawRect(ctx, BLACK, stem.inflate(4, 4), 0, 3);
    drawPoly(ctx, BLACK, [[tx, tipY + dir * 3], [tx - 20, baseY - dir * 2], [tx + 20, baseY - dir * 2]]);
    drawRect(ctx, YELLOW, stem, 0, 2);
    drawPoly(ctx, YELLOW, [[tx, tipY], [tx - 16, baseY], [tx + 16, baseY]]);
    if (hint) this.scTag(hint, tx, dir > 0 ? baseY - 22 - 30 : baseY + 22 + 6, YELLOW, this.f_bold);
  }

  drawTutCaption(s) {
    const tut = this.tut, N = TUTORIAL_STEPS.length;
    const W = 640, x = Math.floor((VIEW_W - W) / 2), y = TOP_H + 10;
    const btnW = s.next ? 214 : 124;
    const lines = this.wrap(s.say(this), this.f_bold, W - 28 - btnW);
    let extra = null;
    if (s.build && !this.canAfford(BUILDINGS[s.build].cost))
      extra = `Saving up food... (needs ${costStr(BUILDINGS[s.build].cost)})`;
    else if (s.slow && this.demo_wave) extra = "Slow motion - follow the labels on the map";
    const h = Math.max(54, 30 + lines.length * 21 + (extra ? 19 : 0) + 6);
    const box = new Rect(x, y, W, h);
    tut.cap_rect = box;
    drawRect(ctx, "rgba(14,10,18,0.95)", box, 0, 10);
    drawRect(ctx, YELLOW, box, 2, 10);
    this.text(`TUTORIAL ${tut.i + 1}/${N}`, this.f_small, YELLOW, x + 14, y + 7);
    drawRect(ctx, [50, 44, 60], new Rect(x + 130, y + 12, 130, 6), 0, 3);
    drawRect(ctx, YELLOW, new Rect(x + 130, y + 12, Math.max(6, 130 * tut.i / (N - 1)), 6), 0, 3);
    lines.forEach((ln, i) => this.text(ln, this.f_bold, WHITE, x + 14, y + 27 + i * 21));
    if (extra) this.text(extra, this.f_small, ORANGE, x + 14, y + 29 + lines.length * 21);
    this.button([x + W - 112, y + 10, 100, 30], "Skip tutorial", () => this.endTutorial(false), "normal", true, this.f_small);
    if (s.next) this.button([x + W - 204, y + 10, 84, 30], "Next >", () => this.tutGo(tut.i + 1), "primary", true, this.f_small);
  }

  // ===================== drawing: picture cards & scenes =====================
  /** One How to Play card: title, animated scene, short caption, real-life line. */
  drawCard(card, r) {
    this.text(card.title, this.f_big, WHITE, r.centerx, r.y + 16, "c");
    const sb = new Rect(r.x + 40, r.y + 76, r.w - 80, 390);
    drawRect(ctx, [22, 16, 26], sb, 0, 10);
    ctx.save();
    ctx.beginPath(); ctx.rect(sb.x, sb.y, sb.w, sb.h); ctx.clip();
    this.drawScene(card.scene, sb);
    ctx.restore();
    drawRect(ctx, PANEL_EDGE, sb, 1, 10);
    let y = sb.bottom + 12;
    for (const ln of this.wrap(card.caption, this.f_med, sb.w).slice(0, 2)) {
      this.text(ln, this.f_med, WHITE, r.centerx, y, "c"); y += this.f_med.h;
    }
    if (card.real && this.state === "HOWTO") {   // biology lives in Learn, not in the running game
      y += 4;
      for (const ln of this.wrap("Real life: " + card.real, this.f, sb.w).slice(0, 2)) {
        this.text(ln, this.f, CYAN, r.centerx, y, "c"); y += this.f.h;
      }
    }
  }
  drawScene(name, b) {
    const t = this.time;
    if (name === "goal") this.sceneGoal(b, t);
    else if (name === "codex") this.sceneCodex(b, t);
    else if (name === "food") this.sceneFood(b, t);
    else if (name === "virus") this.sceneVirus(b, t);
    else if (name === "order") this.sceneOrder(b, t);
    else if (name === "damage") this.sceneDamage(b, t);
    else if (name === "bacteria") this.sceneBacteria(b, t);
    else if (name === "adaptive") this.sceneAdaptive(b, t);
    else if (name === "controls") this.sceneControls(b, t);
    else if (name === "notes") this.sceneNotes(b);
  }

  // ---- small drawing helpers for scenes ----
  scTag(s, x, y, col = WHITE, font = this.f_small) {
    const w = this.measure(s, font) + 14;
    x = clamp(x, w / 2 + 4, WIDTH - w / 2 - 4);
    drawRect(ctx, "rgba(10,6,12,0.85)", new Rect(x - w / 2, y, w, font.h + 6), 0, 6);
    this.text(s, font, col, x, y + 3, "c");
  }
  scVirus(x, y, r = 8, col = FAMILY_COLORS.A, rot = this.time * 1.5) {
    drawCellSprite(ctx, "virion", x, y, Math.max(3, r * 0.8), { t: this.time, phase: x * 0.1, color: col, rot });
  }
  scCell(x, y, r = 10, col = WORKER_DEF.color) {
    const state = col === WORKER_DEF.color ? "" : "infected";
    drawCellSprite(ctx, "worker", x, y, Math.max(4, r * 0.85), { t: this.time, phase: x * 0.1, state });
  }
  scUnit(key, x, y, r = 9) {
    drawCellSprite(ctx, key, x, y, Math.round(r * 1.2), { t: this.time, phase: x * 0.1 });
  }
  scIcon(key, cx, cy, s) {
    const d = BUILDINGS[key];
    const r = new Rect(Math.round(cx - s / 2), Math.round(cy - s / 2), s, s);
    drawRect(ctx, darker(d.color, 0.5), r, 0, 8);
    const dk = darker(d.color, 0.45);
    if (key === "hub") {
      drawCircle(ctx, d.color, [cx, cy], s * 0.24);
      drawCircle(ctx, [255, 150, 160], [cx, cy], s * 0.1);
      return;
    }
    drawRect(ctx, d.color, r.inflate(-8, -8), 0, 6);
    if (d.unit || key === "helper")
      drawCellSprite(ctx, d.unit || "helper", cx, cy + s * 0.04, Math.round(s * 0.22), { t: this.time, phase: cx });
    else if (key === "house")
      for (const [ox, oy] of [[-0.15, 0.08], [0.15, 0.08], [0, -0.15]]) {
        drawCircle(ctx, [255, 230, 240], [cx + ox * s, cy + oy * s], s * 0.12);
        drawCircle(ctx, dk, [cx + ox * s, cy + oy * s], s * 0.12, 1);
      }
  }
  scArrow(a, b, col = GREY, w = 2) {
    drawLine(ctx, col, a, b, w);
    const ang = Math.atan2(b[1] - a[1], b[0] - a[0]);
    drawPoly(ctx, col, [b, [b[0] - Math.cos(ang - 0.5) * 10, b[1] - Math.sin(ang - 0.5) * 10],
                           [b[0] - Math.cos(ang + 0.5) * 10, b[1] - Math.sin(ang + 0.5) * 10]]);
  }
  scCore(cx, cy, s) {
    const col = BUILDINGS.core.color;
    const r = new Rect(Math.round(cx - s / 2), Math.round(cy - s / 2), s, s);
    drawRect(ctx, darker(col, 0.5), r.inflate(12, 12), 0, 16);
    drawRect(ctx, col, r, 0, 12);
    drawRect(ctx, [200, 170, 255], r, 2, 12);
    if (s >= 60) this.text(this.medical ? "LYMPH NODE" : "CORE", this.medical ? this.f_small : this.f_bold, WHITE, cx, cy - 10, "c");
    if (s >= 60) this.drawHqFlag(r.right - 10, r.y + 6, s / 100);
    return r;
  }
  scVessel(x, y, w, h, t, dir = 1) {
    drawRect(ctx, [96, 24, 34], new Rect(x, y, w, h));
    const n = Math.max(4, Math.floor(w / 36));
    for (let i = 0; i < n; i++) {
      const f = (t * 0.12 + i / n) % 1;
      const px = dir > 0 ? x + f * w : x + w - f * w;
      drawCircle(ctx, [150, 44, 56], [px, y + h / 2 + ((i * 7) % 11) - 5], 3);
    }
  }

  // ---- the scenes ----
  sceneGoal(b, t) {
    const cx = b.centerx, cy = b.y + 180;
    this.scVessel(b.x, cy - 15, b.w / 2 - 70, 30, t, 1);
    this.scVessel(cx + 70, cy - 15, b.w / 2 - 70, 30, t, -1);
    const guardX = [cx - 190, cx + 190];
    for (const gx of guardX) this.scUnit("neutrophil", gx, cy - 30, 9);
    const P = 6;
    let hit = false;
    for (let i = 0; i < 6; i++) {
      const side = i % 2 ? 1 : -1;
      const ph = (t / P + i / 6) % 1;
      const sx = side < 0 ? b.x + 16 : b.right - 16, ex = cx + side * 62;
      const x = sx + (ex - sx) * ph, y = cy + Math.sin(ph * 9 + i) * 6;
      const gx = side < 0 ? guardX[0] : guardX[1];
      const past = side < 0 ? x >= gx : x <= gx;
      if (i % 3 !== 2 && past) {   // two out of three get eaten by the guard
        const d = Math.abs(x - gx);
        if (d < 30) drawCircle(ctx, css(WHITE, 1 - d / 30), [gx, cy], 8 + d * 0.6, 2);
        continue;
      }
      if (ph > 0.96) hit = true;
      this.scVirus(x, y, 8);
    }
    const cr = this.scCore(cx, cy, 104);
    if (hit) drawRect(ctx, RED, cr.inflate(10, 10), 4, 18);
    const frac = 1 - 0.4 * ((t % 12) / 12);
    const bar = new Rect(cx - 90, cy + 76, 180, 12);
    drawRect(ctx, [50, 20, 26], bar, 0, 4);
    drawRect(ctx, frac > 0.7 ? GREEN : YELLOW, new Rect(bar.x, bar.y, bar.w * frac, bar.h), 0, 4);
    this.text("Core health - if it hits 0, you lose", this.f_small, GREY, cx, bar.bottom + 6, "c");
    this.scTag("Virus comes in", b.x + 90, cy - 62, RED, this.f_bold);
    this.scTag(`${this.name(CELL_TYPES.neutrophil)}: eats it`, guardX[0], cy - 72, WHITE);
    this.scTag("Virus that gets through hurts the Core", cx, cy - 110, ORANGE);
  }

  /** The whole cast: each sprite big, with its uniform and its job. */
  sceneCodex(b, t) {
    const cast = [
      ["neutrophil", CELL_TYPES.neutrophil, "First in, eats virus. Careless! Explodes into a sticky NET."],
      ["macrophage", CELL_TYPES.macrophage, "Eats virus and dead-cell bubbles. Killer mode near a General."],
      ["dendritic", CELL_TYPES.dendritic, "Bags a virus sample and delivers it to the Core."],
      ["nk", CELL_TYPES.nk, "Checks MHC-I ID cards. Cells hiding their ID get taken down."],
      ["killer_t", CELL_TYPES.killer_t, "Trained for one strain. Orders infected cells to self-destruct."],
      ["bcell", CELL_TYPES.bcell, "Shoots antibodies: tagged virus can't infect and is easy to eat."],
      ["helper", HELPER_DEF, "Speeds up learning and powers up cells near its Command Post."],
      ["worker", WORKER_DEF, "Builds and repairs. The virus can hijack it."],
      ["virion", VIRUS_DEF, "The enemy. Breaks into cells and turns them into virus factories."],
    ];
    const cw = b.w / 3, ch = 128;
    const active = Math.floor(t / 2.2) % cast.length;
    cast.forEach(([key, def, job], i) => {
      const x = b.x + (i % 3) * cw, y = b.y + 3 + Math.floor(i / 3) * ch;
      const box = new Rect(x + 6, y + 3, cw - 12, ch - 6);
      drawRect(ctx, i === active ? [46, 36, 54] : [30, 23, 35], box, 0, 10);
      drawRect(ctx, i === active ? YELLOW : [58, 50, 68], box, i === active ? 2 : 1, 10);
      const r = key === "macrophage" ? 29 : key === "worker" ? 22 : key === "virion" ? 23 : 27;
      drawCellSprite(ctx, key, x + 54, y + ch / 2 + 8, r,
                     { t, phase: i, color: FAMILY_COLORS.A, punch: i === active ? Math.max(0, Math.sin(t * 6)) * 0.6 : 0 });
      const tx = x + 110, tw = cw - 120;
      this.text(this.name(def), this.f_bold, def.color || (key === "virion" ? RED : [140, 200, 252]), tx, y + 12);
      let ly = y + 34;
      for (const ln of this.wrap(OUTFIT[key], this.f_small, tw).slice(0, 2)) {
        this.text(ln, this.f_small, YELLOW, tx, ly); ly += 16;
      }
      ly += 4;
      for (const ln of this.wrap(job, this.f_small, tw).slice(0, 3)) {
        this.text(ln, this.f_small, [205, 198, 218], tx, ly); ly += 16;
      }
    });
  }

  sceneFood(b, t) {
    const split = b.x + b.w * 0.58;
    drawLine(ctx, PANEL_EDGE, [split, b.y + 20], [split, b.bottom - 20], 1);
    // left: vessel -> capillary -> food counters
    const vy = b.y + 270, vx1 = split - 20;
    this.scVessel(b.x, vy, vx1 - b.x, 36, t, 1);
    this.scTag("Blood vessel (dark red tiles)", (b.x + vx1) / 2, vy + 46, [235, 150, 160]);
    const capx = b.x + (vx1 - b.x) * 0.5, capy = vy - 22;
    const cap = new Rect(capx - 22, capy - 22, 44, 44);
    drawRect(ctx, darker(BUILDINGS.hub.color, 0.5), cap, 0, 6);
    drawCircle(ctx, BUILDINGS.hub.color, [capx, capy], 10);
    drawCircle(ctx, [255, 150, 160], [capx, capy], 4);
    drawRect(ctx, css(YELLOW, 0.5 + 0.5 * Math.sin(t * 4)), cap.inflate(6, 6), 2, 8);
    this.scTag(`${this.name(BUILDINGS.hub)} (touches the vessel)`, capx, capy - 58, WHITE);
    const boxY = b.y + 22;
    const boxes = [[capx - 175, "Blood glucose", YELLOW, 140 + Math.trunc((t * 6) % 60), "+1.6/s"],
                   [capx + 25, "Amino acids", GREEN, 120 + Math.trunc((t * 4) % 60), "+1.1/s"]];
    for (const [bx, lab, col, val, rate] of boxes) {
      drawRect(ctx, PANEL, new Rect(bx, boxY, 150, 54), 0, 8);
      drawRect(ctx, PANEL_EDGE, new Rect(bx, boxY, 150, 54), 1, 8);
      this.text(lab, this.f_small, GREY, bx + 10, boxY + 5);
      const w = this.text(String(val), this.f_med, col, bx + 10, boxY + 22);
      this.text(rate, this.f_small, GREEN, bx + 16 + w, boxY + 29);
    }
    for (let k = 0; k < 10; k++) {
      const f = (t * 0.45 + k / 10) % 1;
      const side = k % 2 ? 1 : -1;
      const x = capx + side * 100 * f + Math.sin(f * 7 + k) * 6;
      const y = capy - 28 - f * (capy - 28 - (boxY + 64));
      drawCircle(ctx, k % 2 ? GREEN : YELLOW, [x, y], 3);
    }
    // right: a worker builds a blueprint
    const rx = split + 20, rw = b.right - 20 - rx;
    this.text("Workers build for you", this.f_bold, WHITE, rx + rw / 2, b.y + 26, "c");
    const P = 7, ph = (t % P) / P;
    const bx = rx + rw * 0.62, by = b.y + 180;
    const br = new Rect(bx - 32, by - 32, 64, 64);
    const col = BUILDINGS.neu_nest.color;
    if (ph >= 0.08 && ph < 0.85) {
      drawRect(ctx, css(col, 0.2), br, 0, 6);
      drawRect(ctx, col, br, 2, 6);
      const prog = clamp((ph - 0.4) / 0.45, 0, 1);
      drawRect(ctx, [30, 20, 24], new Rect(br.x + 6, br.bottom - 12, br.w - 12, 5));
      drawRect(ctx, CYAN, new Rect(br.x + 6, br.bottom - 12, (br.w - 12) * prog, 5));
    } else if (ph >= 0.85) {
      this.scIcon("neu_nest", bx, by, 64);
    } else {
      drawRect(ctx, css(WHITE, 0.25), br, 1, 6);
    }
    if (ph < 0.14) {
      const p = [bx + 6, by + 6];
      drawPoly(ctx, WHITE, [p, [p[0], p[1] + 20], [p[0] + 5, p[1] + 15], [p[0] + 12, p[1] + 16]]);
      drawCircle(ctx, YELLOW, [bx, by], 6 + ph * 120, 2);
    }
    if (ph >= 0.12) {
      const wf = clamp((ph - 0.12) / 0.28, 0, 1);
      const sx = rx + 30, sy = by + 110, ex = bx - 46, ey = by + 12;
      let wx = sx + (ex - sx) * wf, wy = sy + (ey - sy) * wf;
      if (ph > 0.4 && ph < 0.85) { wx += Math.sin(t * 14) * 2; wy += Math.cos(t * 11) * 2; }
      this.scCell(wx, wy, 7);
    }
    const steps = ["1. Click a card, then the map", "2. A worker walks over", "3. It builds...", "4. Done!"];
    const k = ph < 0.12 ? 0 : ph < 0.4 ? 1 : ph < 0.85 ? 2 : 3;
    steps.forEach((s, i) => this.text(s, this.f, i === k ? YELLOW : [110, 104, 120], rx + 24, b.y + 262 + i * 26));
  }

  sceneVirus(b, t) {
    const rowY = b.y + 120;
    const active = Math.floor(t / 1.8) % 4;
    const labels = ["1. Virus drifts in", "2. Gets inside a cell", "3. Cell is hijacked", "4. Bursts: more virus!"];
    const subs = ["", "", "turns purple, makes virus", ""];
    for (let k = 0; k < 4; k++) {
      const x = b.x + b.w * (0.125 + k * 0.25), cy = rowY - 15;
      const box = new Rect(x - 105, rowY - 92, 210, 196);
      drawRect(ctx, k === active ? [46, 36, 54] : [30, 22, 34], box, 0, 10);
      if (k === active) drawRect(ctx, YELLOW, box, 2, 10);
      if (k < 3) this.scArrow([x + 107, rowY - 15], [x + 133, rowY - 15], GREY);
      if (k === 0) {
        this.scCell(x + 34, cy, 20);
        this.scVirus(x - 70 + ((t * 25) % 66), cy + Math.sin(t * 3) * 5, 8);
      } else if (k === 1) {
        this.scCell(x, cy, 20);
        const a = -2.4 + Math.sin(t * 2) * 0.12;
        this.scVirus(x + Math.cos(a) * 22, cy + Math.sin(a) * 22, 7);
        drawCircle(ctx, css(INFECT, 0.6), [x, cy], 24 + (t * 10) % 8, 1);
      } else if (k === 2) {
        const p = 0.5 + 0.5 * Math.sin(t * 6);
        this.scCell(x, cy, 22, lerpCol(INFECT, [230, 140, 240], p * 0.4));
        for (let i = 0; i < 3; i++) {
          const a = t * 1.5 + i * TAU / 3;
          this.scVirus(x + Math.cos(a) * 9, cy + Math.sin(a) * 9, 4);
        }
        drawArc(ctx, RED, new Rect(x - 30, cy - 30, 60, 60), Math.PI / 2, Math.PI / 2 + TAU * ((t % 3) / 3), 3);
      } else {
        const ph = (t % 1.6) / 1.6;
        drawCircle(ctx, css(INFECT, 1 - ph), [x, cy], 10 + ph * 34, 3);
        for (let i = 0; i < 4; i++) {
          const a = i * Math.PI / 2 + 0.4, d = 8 + ph * 55;
          this.scVirus(x + Math.cos(a) * d, cy + Math.sin(a) * d, 7);
        }
      }
      this.text(labels[k], this.f_bold, WHITE, x, rowY + 46, "c");
      if (subs[k]) this.text(subs[k], this.f_small, [210, 160, 225], x, rowY + 68, "c");
    }
    // interferon: a warning signal that shields the neighbours
    const y2 = b.y + 318, ix = b.x + 120;
    this.scCell(ix, y2, 16, INFECT);
    const rp = (t % 2) / 2;
    drawCircle(ctx, css(IFN_COL, 1 - rp), [ix, y2], 18 + rp * 80, 2);
    for (const nx of [ix + 100, ix + 170]) { this.scCell(nx, y2, 14); drawCircle(ctx, IFN_COL, [nx, y2], 19, 2); }
    const vb = Math.abs(Math.sin(t * 2));
    const vx = ix + 270 - vb * 62;
    this.scVirus(vx, y2, 7);
    if (vb > 0.9) this.text("blocked", this.f_small, IFN_COL, vx, y2 - 30, "c");
    this.text("Interferon: blue-ring cells are hard to infect", this.f_small, IFN_COL, ix + 140, y2 + 26, "c");
    // a killer stops the infected cell before it bursts
    const kx = b.x + b.w * 0.78;
    const kp = (t % 3) / 3;
    if (kp < 0.7) this.scCell(kx, y2, 16, INFECT);
    else drawCircle(ctx, css(GREEN, 1 - (kp - 0.7) / 0.3), [kx, y2], 10 + (kp - 0.7) * 100, 3);
    this.scUnit("nk", kx - 120 + Math.min(1, kp / 0.6) * 96, y2, 10);
    this.text("Kill purple cells before they burst", this.f_small, GREEN, kx - 40, y2 + 26, "c");
  }

  sceneOrder(b, t) {
    const items = [
      { keys: ["hub"], tag: "x2", why: "Food" },
      { keys: ["neu_nest"], why: "Eats virus" },
      { keys: ["dc_niche"], why: "Delivers virus samples" },
      { keys: ["house"], why: "+5 room for cells" },
      { keys: ["nk_den"], why: "Kills purple cells" },
      { keys: ["helper"], why: "Learning 2x faster" },
      { keys: ["thymus", "bcenter"], why: "Learned killers & antibodies" },
    ];
    const tw = 120, gap = 20, ty = b.y + 92, th = 214;
    const tx = i => b.x + i * (tw + gap);
    const groups = [[0, 4, "BEFORE THE FIRST WAVE", YELLOW], [5, 6, "AFTER A FEW WAVES", CYAN]];
    for (const [a, z, lab, col] of groups) {
      const x0 = tx(a) + 6, x1 = tx(z) + tw - 6;
      drawLines(ctx, col, [[x0, b.y + 72], [x0, b.y + 62], [x1, b.y + 62], [x1, b.y + 72]], 2);
      this.text(lab, this.f_bold, col, (x0 + x1) / 2, b.y + 32, "c");
    }
    const active = Math.floor(t / 1.1) % items.length;
    items.forEach((it, i) => {
      const lift = i === active ? -6 : 0;
      const r = new Rect(tx(i), ty + lift, tw, th);
      drawRect(ctx, i === active ? [52, 44, 62] : [38, 32, 46], r, 0, 10);
      drawRect(ctx, i === active ? YELLOW : darker(BUILDINGS[it.keys[0]].color, 0.7), r, i === active ? 3 : 2, 10);
      drawCircle(ctx, PANEL_EDGE, [r.x + 18, r.y + 18], 13);
      this.text(String(i + 1), this.f_bold, WHITE, r.x + 18, r.y + 8, "c");
      if (it.tag) this.text(it.tag, this.f_med, YELLOW, r.right - 12, r.y + 6, "r");
      if (it.keys.length === 1) this.scIcon(it.keys[0], r.centerx, r.y + 66, 52);
      else { this.scIcon(it.keys[0], r.centerx - 24, r.y + 66, 42); this.scIcon(it.keys[1], r.centerx + 24, r.y + 66, 42); }
      const name = it.keys.map(k => this.name(BUILDINGS[k])).join(" + ");
      this.wrap(name, this.f_small, tw - 12).slice(0, 3).forEach((ln, li) =>
        this.text(ln, this.f_small, WHITE, r.centerx, r.y + 102 + li * 16, "c"));
      this.wrap(it.why, this.f_small, tw - 12).slice(0, 2).forEach((ln, li) =>
        this.text(ln, this.f_small, YELLOW, r.centerx, r.y + 160 + li * 16, "c"));
      if (i < items.length - 1) this.scArrow([r.right + 3, ty + th / 2], [r.right + gap - 3, ty + th / 2], GREY, 2);
    });
    this.text("Tip: keep at least 2 Capillaries - cells starve without glucose.", this.f, GREY, b.centerx, b.y + 340, "c");
  }

  sceneDamage(b, t) {
    const rows = [
      { who: ["neutrophil", "macrophage"], verb: "EAT", fx: "eat", tgt: "virus",
        tgtText: "Free virus. Cleaners also eat dead-cell bubbles",
        real: "Phagocytosis: swallow it, dissolve it in acid, spit out the scraps." },
      { who: ["bcell"], verb: "TAG + SHOOT", fx: "ab", tgt: "tagged",
        tgtText: "Free virus of a learned strain (tagged = eaten 2x faster)",
        real: "Antibodies block the virus and mark it for eating (opsonization)." },
      { who: ["nk", "killer_t"], verb: "KILL", fx: "kill", tgt: "infected",
        tgtText: "Infected (purple) cells - they pop into virus bubbles",
        real: "Killer cells order infected cells to self-destruct (apoptosis)." },
      { who: ["core"], verb: "ZAP", fx: "zap", tgt: "virus",
        tgtText: "Free virus near the Core", real: "Complement proteins punch holes in virus particles." },
      { who: ["infected"], verb: "SHIELD", fx: "ifn", tgt: "shield",
        tgtText: "Neighbour cells resist infection (no damage)", real: "Interferon warns nearby cells to block viruses." },
      { who: ["virus"], verb: "INFECT", fx: "virus", tgt: "cell",
        tgtText: "Your cells (they burst) and the Core", real: "The virus hijacks cells and bursts them open (lysis)." },
    ];
    const X = { who: b.x + 20, names: b.x + 84, verb: b.x + 236, tgt: b.x + 384, tgtText: b.x + 404, real: b.x + 632 };
    const hy = b.y + 12;
    this.text("WHO", this.f_small, GREY, X.who, hy);
    this.text("DOES", this.f_small, GREY, X.verb, hy);
    this.text("TO WHAT", this.f_small, GREY, X.tgt - 10, hy);
    this.text("REAL LIFE", this.f_small, CYAN, X.real, hy);
    const rowH = 57, y0 = b.y + 36;
    rows.forEach((row, i) => {
      const y = y0 + i * rowH, cy = y + rowH / 2;
      if (i % 2 === 0) drawRect(ctx, [30, 23, 35], new Rect(b.x + 8, y, b.w - 16, rowH), 0, 6);
      // who
      row.who.forEach((k, j) => {
        const x = X.who + 14 + j * 28;
        if (CELL_TYPES[k]) this.scUnit(k, x, cy, 9);
        else if (k === "core") this.scCore(x + 8, cy, 26);
        else if (k === "infected") this.scCell(x, cy, 11, INFECT);
        else if (k === "virus") this.scVirus(x, cy, 10);
      });
      const names = row.who.map(k => CELL_TYPES[k] ? this.name(CELL_TYPES[k])
        : k === "core" ? (this.medical ? "Lymph node" : "Core")
        : k === "infected" ? "Infected cell" : "Virus").join(" & ");
      const nl = this.wrap(names, this.f_small, 128).slice(0, 3);
      nl.forEach((ln, li) => this.text(ln, this.f_small, WHITE, X.names, cy - nl.length * 9 + li * 18));
      // verb + a moving "attack" from left to right
      const vcol = { eat: WHITE, ab: IFN_COL, kill: RED, zap: [200, 170, 255], ifn: IFN_COL, virus: RED }[row.fx];
      this.text(row.verb, this.f_bold, vcol, X.verb, cy - 20);
      const f = (t * 0.7 + i * 0.17) % 1;
      const px = X.verb + f * 120, py = cy + 10;
      drawLine(ctx, [60, 52, 72], [X.verb, py], [X.verb + 126, py], 1);
      if (row.fx === "eat") drawCircle(ctx, WHITE, [px, py], 4);
      else if (row.fx === "ab") {
        drawLine(ctx, IFN_COL, [px - 5, py], [px, py], 2);
        drawLine(ctx, IFN_COL, [px, py], [px + 4, py - 4], 2);
        drawLine(ctx, IFN_COL, [px, py], [px + 4, py + 4], 2);
      } else if (row.fx === "kill") drawPoly(ctx, RED, [[px + 6, py], [px - 4, py - 5], [px - 4, py + 5]]);
      else if (row.fx === "zap") drawLine(ctx, [200, 170, 255], [px - 14, py], [px, py], 3);
      else if (row.fx === "ifn") drawCircle(ctx, css(IFN_COL, 1 - f), [X.verb + 60, py], 4 + f * 18, 2);
      else this.scVirus(px, py, 5);
      // target
      const tx = X.tgt;
      if (row.tgt === "virus") this.scVirus(tx, cy, 9);
      else if (row.tgt === "tagged") {
        this.scVirus(tx, cy, 9, lerpCol(FAMILY_COLORS.A, IFN_COL, 0.6));
        for (const a of [t, t + 2.1, t + 4.2])
          drawLine(ctx, IFN_COL, [tx + Math.cos(a) * 8, cy + Math.sin(a) * 8], [tx + Math.cos(a) * 13, cy + Math.sin(a) * 13], 2);
      } else if (row.tgt === "infected") this.scCell(tx, cy, 11, INFECT);
      else if (row.tgt === "shield") { this.scCell(tx, cy, 10); drawCircle(ctx, IFN_COL, [tx, cy], 14, 2); }
      else { this.scCell(tx, cy, 10); this.scVirus(tx - 9, cy - 8, 5); }
      const tl = this.wrap(row.tgtText, this.f_small, 214).slice(0, 2);
      tl.forEach((ln, li) => this.text(ln, this.f_small, [215, 210, 225], X.tgtText, cy - tl.length * 9 + li * 18));
      const rl = this.wrap(row.real, this.f_small, b.right - 16 - X.real).slice(0, 2);
      rl.forEach((ln, li) => this.text(ln, this.f_small, CYAN, X.real, cy - rl.length * 9 + li * 18));
    });
  }

  sceneAdaptive(b, t) {
    const boxes = [
      [new Rect(b.x + 20, b.y + 14, b.w / 2 - 30, 124), "INNATE: fast, attacks anything", "no memory", CYAN,
       ["neutrophil", "macrophage", "nk", "dendritic"]],
      [new Rect(b.centerx + 10, b.y + 14, b.w / 2 - 30, 124), "ADAPTIVE: slow at first, one strain", "remembers it next time", GREEN,
       ["killer_t", "bcell"]],
    ];
    for (const [r, title, sub, col, keys] of boxes) {
      drawRect(ctx, [30, 23, 35], r, 0, 10);
      drawRect(ctx, darker(col, 0.6), r, 2, 10);
      this.text(title, this.f_bold, col, r.x + 14, r.y + 8);
      this.text(sub, this.f_small, GREY, r.x + 14, r.y + 29);
      const step = r.w / keys.length;
      keys.forEach((k, i) => {
        const x = r.x + step * (i + 0.5);
        this.scUnit(k, x, r.y + 68, 11);
        this.wrap(this.name(CELL_TYPES[k]), this.f_small, step - 8).slice(0, 2).forEach((ln, li) =>
          this.text(ln, this.f_small, WHITE, x, r.y + 86 + li * 16, "c"));
      });
    }
    // flow: courier -> core -> learning -> fighters for that strain
    const y = b.y + 240, P = 10, ph = (t % P) / P;
    const s1 = b.x + 115, coreX = b.x + 560, s4 = b.x + 830;
    const stage = ph < 0.2 ? 0 : ph < 0.5 ? 1 : ph < 0.75 ? 2 : 3;
    drawLine(ctx, [50, 42, 60], [s1, y], [s4, y], 2);
    if (ph < 0.2) this.scVirus(s1, y, 9);
    let dx, dy = y - 26;
    if (ph < 0.2) dx = s1 - 80 + 70 * (ph / 0.2);
    else if (ph < 0.5) dx = s1 - 10 + (coreX - 60 - (s1 - 10)) * ((ph - 0.2) / 0.3);
    else dx = coreX - 60;
    drawCellSprite(ctx, "dendritic", dx, dy, 13,
                   { t: this.time, phase: 1, state: ph >= 0.2 && ph < 0.5 ? "carry" : "" });
    this.scCore(coreX, y, 70);
    if (ph >= 0.5 && ph < 0.75) {
      const p = 0.5 + 0.5 * Math.sin(t * 6);
      drawCircle(ctx, CYAN, [coreX, y], 50 + p * 6, 2);
      const lr = new Rect(coreX - 50, y + 50, 100, 8);
      drawRect(ctx, [30, 30, 40], lr, 0, 3);
      drawRect(ctx, CYAN, new Rect(lr.x, lr.y, lr.w * ((ph - 0.5) / 0.25), lr.h), 0, 3);
    }
    if (ph >= 0.75) {
      const f = (ph - 0.75) / 0.25;
      drawCircle(ctx, GREEN, [coreX, y], 52, 2);
      for (let i = 0; i < 5; i++) {
        const k = i < 3 ? "killer_t" : "bcell";
        const x = coreX + 50 + (s4 - 80 - coreX) * Math.min(1, f * 1.4) + (i % 3) * 16;
        this.scUnit(k, x, y - 30 + i * 15, 8);
      }
      this.scVirus(s4, y - 12, 9);
      this.scCell(s4 + 20, y + 22, 11, INFECT);
      if (f > 0.5) this.scTag("MEMORY", coreX, y - 74, GREEN, this.f_bold);
    }
    const labels = [[b.x + 115, "1. Courier bags a sample"], [b.x + 335, "2. Carries it to the Core"],
                    [coreX, "3. Core learns (takes time)"], [b.x + 815, "4. Fighters for THAT strain"]];
    labels.forEach(([x, s], i) => this.text(s, this.f_bold, i === stage ? YELLOW : [110, 104, 120], x, y + 70, "c"));
    this.text("Same strain again? Memory makes the response fast. A vaccine gives memory early.",
              this.f_small, GREEN, b.centerx, b.y + 352, "c");
  }

  sceneControls(b, t) {
    const rows = [
      [["W", "A", "S", "D"], "Move the camera"], [["Left click"], "Select / place a building"],
      [["Drag"], "Select a group of cells"], [["Right click"], "Send cells / cancel"],
      [["Space"], "Pause"], [["+", "-"], "Game speed"],
      [["Tab"], "Next build tab"], [["1", "2", "3", "4", "5"], "Pick a building"],
      [["F"], "Select all fighters"], [["H"], "Jump to your Core"],
      [["N"], "Call the next wave early"], [["M"], "Simple / medical names"],
    ];
    const active = Math.floor(t / 1.2) % rows.length;
    rows.forEach(([keys, desc], i) => {
      const col = Math.floor(i / 6), j = i % 6;
      let x = col === 0 ? b.x + 40 : b.centerx + 30;
      const y = b.y + 26 + j * 58;
      for (const k of keys) {
        const w = Math.max(36, this.measure(k, this.f_bold) + 20);
        drawRect(ctx, [20, 16, 24], new Rect(x, y + 4, w, 36), 0, 7);
        drawRect(ctx, i === active ? [80, 72, 40] : [58, 52, 70], new Rect(x, y, w, 36), 0, 7);
        drawRect(ctx, i === active ? YELLOW : PANEL_EDGE, new Rect(x, y, w, 36), 1, 7);
        this.text(k, this.f_bold, WHITE, x + w / 2, y + 8, "c");
        x += w + 6;
      }
      this.text(desc, this.f, i === active ? YELLOW : WHITE, x + 10, y + 8);
    });
  }

  sceneBacteria(b, t) {
    const split = b.x + b.w * 0.5;
    drawLine(ctx, PANEL_EDGE, [split, b.y + 20], [split, b.bottom - 20], 1);
    // left: one bacterium divides again and again
    const P = 9, ph = (t % P) / P;
    const stage = ph < 0.25 ? 0 : ph < 0.5 ? 1 : ph < 0.75 ? 2 : 3;   // 1, 2, 4, 8 bacteria
    const n = 1 << stage;
    const cx = b.x + (split - b.x) / 2, cy = b.y + 120;
    for (let i = 0; i < n; i++) {
      const col = i % 4, row = Math.floor(i / 4);
      const x = cx + (col - (Math.min(n, 4) - 1) / 2) * 64;
      const y = cy + (n > 4 ? (row - 0.5) * 58 : 0);
      drawCellSprite(ctx, "bacterium", x, y, 16, { t, phase: i * 1.7 });
    }
    const labels = ["1. One bacterium", "2. It splits in two", "3. Doubling again and again!"];
    const k = stage === 0 ? 0 : stage === 1 ? 1 : 2;
    labels.forEach((s, i) => this.text(s, this.f, i === k ? YELLOW : [110, 104, 120], b.x + 40, b.y + 232 + i * 26));
    this.scTag("Kill them early or they snowball!", cx, b.bottom - 44, ORANGE);
    // right: who can fight them
    const rx = split + 24, rw = b.right - 24 - rx;
    this.text("WHO FIGHTS BACTERIA?", this.f_bold, WHITE, rx + rw / 2, b.y + 20, "c");
    const rows = [["neutrophil", true, "Eat them - best against bacteria!"], ["macrophage", true, "Eat them"],
                  ["bcell", true, "Tag them with antibodies"], ["nk", false, "Check infected cells, not bacteria"],
                  ["killer_t", false, "Only attack infected cells"]];
    rows.forEach(([key, ok, txt], i) => {
      const y = b.y + 86 + i * 64;
      this.scUnit(key, rx + 26, y, 11);
      this.text(this.name(CELL_TYPES[key]), this.f_bold, WHITE, rx + 62, y - 20);
      this.text(txt, this.f_small, ok ? GREEN : [220, 130, 130], rx + 62, y + 2);
      drawCircle(ctx, ok ? GREEN : RED, [rx + rw - 12, y - 8], 7);
    });
  }
  sceneNotes(b) {
    let y = b.y + 22;
    this.text("The game simplifies real biology. Be honest with your class:", this.f_bold, YELLOW, b.x + 30, y);
    y += 34;
    for (const note of SCIENCE_NOTES) {
      const lines = this.wrap(note, this.f, b.w - 80);
      drawCircle(ctx, GREY, [b.x + 38, y + 10], 3);
      lines.forEach(ln => { this.text(ln, this.f, [215, 210, 225], b.x + 52, y); y += this.f.h; });
      y += 9;
    }
  }

  // ============================== main loop ==============================
  draw(dt) {
    this.click_targets = [];
    const st = this.state;
    if (st === "MENU") this.drawMenu(dt);
    else if (st === "HOWTO") this.drawHowto(dt);
    else if (st === "OPTIONS") this.drawOptions(dt);
    else if (st === "PLAYING") this.drawGame();
    else if (st === "PAUSED") this.drawPause();
    else if (st === "ADAPT") this.drawAdapt();
    else if (st === "GAMEOVER") this.drawEnd();
    else if (st === "LEARN") this.drawLearn(dt);
  }
  step(dt) {
    this.time += dt;
    if (this.state === "PLAYING") {
      this.updateCamera(dt);
      this.updateTutorial(dt);
      if (!this.paused && !this.tutCard()) {
        // the tutorial's practice attack plays in slow motion so it can be watched
        const tut = this.tut;
        const sdt = tut && TUTORIAL_STEPS[tut.i].slow && tut.t < 45 ? dt * 0.6 : dt;
        for (let i = 0; i < this.speed; i++) {
          this.updateSim(sdt);
          if (this.state !== "PLAYING") break;
        }
        this.updateFx(sdt * this.speed);
      }
    }
  }
}

// ---------------------------- BOOT & EVENTS -----------------------------
const game = new Game();

function toGame(e) {
  const r = canvas.getBoundingClientRect();
  return [(e.clientX - r.left) * WIDTH / r.width, (e.clientY - r.top) * HEIGHT / r.height];
}

canvas.addEventListener("contextmenu", e => e.preventDefault());
canvas.addEventListener("pointerdown", e => {
  canvas.focus();
  try { canvas.setPointerCapture(e.pointerId); } catch (_) { /* not supported */ }
  const pos = toGame(e);
  input.mouse = pos;
  const button = e.button + 1;   // pygame numbering: 1 left, 2 middle, 3 right
  e.preventDefault();
  if (button === 1 && game.handleClick(...pos)) return;
  if (game.state === "PLAYING" && VIEW_RECT.collidepoint(...pos)) game.worldMouseDown(button, pos);
});
canvas.addEventListener("pointermove", e => {
  input.mouse = toGame(e);
  game.mouseMotion(input.mouse);
});
canvas.addEventListener("pointerup", e => {
  input.mouse = toGame(e);
  if (game.state === "PLAYING") game.mouseUp(e.button + 1, input.mouse, e.shiftKey);
});

const KEYMAP = { Escape: "escape", Enter: "enter", " ": " ", Tab: "tab", Delete: "delete", Backspace: "delete" };
window.addEventListener("keydown", e => {
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  input.keys.add(e.code);
  if ([" ", "Tab", "ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight"].includes(e.key)) e.preventDefault();
  if (e.repeat) return;
  const key = KEYMAP[e.key] || (e.key.length === 1 ? e.key.toLowerCase() : null);
  if (key) game.handleKey(key);
});
window.addEventListener("keyup", e => input.keys.delete(e.code));
window.addEventListener("blur", () => input.keys.clear());

let last = performance.now();
function frame(now) {
  const dt = Math.min((now - last) / 1000, 0.05);
  last = now;
  game.step(dt);
  game.draw(dt);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
canvas.focus();

// First visit: go straight into the guided tutorial instead of the main menu.
// It is marked as done (localStorage) once the player finishes or skips it, so
// returning players land on the menu as before. The "Tutorial" menu button and
// How to Play still let anyone replay it.
</script>
