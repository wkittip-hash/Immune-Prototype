const TAU = Math.PI * 2;
const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
const dist = (a, b) => Math.hypot(a[0] - b[0], a[1] - b[1]);
const darker = (c, f = 0.6) => [Math.floor(c[0] * f), Math.floor(c[1] * f), Math.floor(c[2] * f)];
const lerpCol = (a, b, t) => [0, 1, 2].map(i => Math.floor(a[i] + (b[i] - a[i]) * t));
const css = (c, a) => a === undefined ? `rgb(${c[0]},${c[1]},${c[2]})` : `rgba(${c[0]},${c[1]},${c[2]},${a})`;
const nm = (d, medical) => medical ? d.medical : d.simple;

function costStr(cost) {
  const parts = [];
  if (cost.atp) parts.push(`${cost.atp} ${RES_SHORT.atp}`);
  if (cost.bio) parts.push(`${cost.bio} ${RES_SHORT.bio}`);
  return parts.length ? parts.join(" + ") : "Free";
}

// Random helpers (Python random module equivalents)
function makeRng(seed) {
  let a = seed === undefined ? (Math.random() * 4294967296) >>> 0 : seed >>> 0;
  const random = () => {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
  return {
    random,
    uniform: (lo, hi) => lo + random() * (hi - lo),
    randint: (lo, hi) => lo + Math.floor(random() * (hi - lo + 1)),
    choice: arr => arr[Math.floor(random() * arr.length)],
  };
}
const R = makeRng();
function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(R.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}
function sample(n, k) { return shuffle([...Array(n).keys()]).slice(0, k); }

class Rect {
  constructor(x, y, w, h) { this.x = x; this.y = y; this.w = w; this.h = h; }
  get right() { return this.x + this.w; }
  get bottom() { return this.y + this.h; }
  get centerx() { return this.x + Math.floor(this.w / 2); }
  get centery() { return this.y + Math.floor(this.h / 2); }
  move(dx, dy) { return new Rect(this.x + dx, this.y + dy, this.w, this.h); }
  inflate(dx, dy) { return new Rect(this.x - Math.floor(dx / 2), this.y - Math.floor(dy / 2), this.w + dx, this.h + dy); }
  collidepoint(x, y) { return x >= this.x && x < this.right && y >= this.y && y < this.bottom; }
  colliderect(o) { return this.x < o.right && o.x < this.right && this.y < o.bottom && o.y < this.bottom; }
}
const VIEW_RECT = new Rect(0, TOP_H, VIEW_W, VIEW_H);

class MinHeap {
  constructor() { this.a = []; }
  get size() { return this.a.length; }
  push(v) {
    const a = this.a; a.push(v); let i = a.length - 1;
    while (i > 0) { const p = (i - 1) >> 1; if (a[p][0] <= a[i][0]) break; [a[p], a[i]] = [a[i], a[p]]; i = p; }
  }
  pop() {
    const a = this.a; const top = a[0]; const last = a.pop();
    if (a.length) {
      a[0] = last; let i = 0;
      for (;;) {
        const l = 2 * i + 1, r = l + 1; let m = i;
        if (l < a.length && a[l][0] < a[m][0]) m = l;
        if (r < a.length && a[r][0] < a[m][0]) m = r;
        if (m === i) break; [a[m], a[i]] = [a[i], a[m]]; i = m;
      }
    }
    return top;
  }
}

const canvas = document.getElementById("game");

const FAM = '"Atkinson Hyperlegible", "Segoe UI", Arial, sans-serif';
const DISP = '"Chakra Petch", "Segoe UI", Arial, sans-serif';
const mkFont = (size, bold, fam = FAM) => ({ css: `${bold ? 700 : 400} ${size}px ${fam}`, h: Math.round(size * 1.25), size });

// Drawing primitives with pygame-like semantics (width 0 = filled).
function pathRect(c, x, y, w, h, r) {
  c.beginPath();
  if (r > 0 && w > 0 && h > 0 && c.roundRect) c.roundRect(x, y, w, h, Math.min(r, w / 2, h / 2));
  else c.rect(x, y, Math.max(0, w), Math.max(0, h));
}
function drawRect(c, color, r, width = 0, radius = 0) {
  if (Array.isArray(r)) r = new Rect(...r);
  if (width > 0) {
    c.lineWidth = width; c.strokeStyle = typeof color === "string" ? color : css(color);
    pathRect(c, r.x + width / 2, r.y + width / 2, r.w - width, r.h - width, Math.max(0, radius - width / 2));
    c.stroke();
  } else {
    c.fillStyle = typeof color === "string" ? color : css(color);
    pathRect(c, r.x, r.y, r.w, r.h, radius);
    c.fill();
  }
}
function drawCircle(c, color, p, r, width = 0) {
  if (r <= 0) return;
  c.beginPath();
  if (width > 0) {
    c.arc(p[0], p[1], Math.max(0.5, r - width / 2), 0, TAU);
    c.lineWidth = width; c.strokeStyle = typeof color === "string" ? color : css(color); c.stroke();
  } else {
    c.arc(p[0], p[1], r, 0, TAU);
    c.fillStyle = typeof color === "string" ? color : css(color); c.fill();
  }
}
function drawPoly(c, color, pts, width = 0) {
  c.beginPath(); c.moveTo(pts[0][0], pts[0][1]);
  for (let i = 1; i < pts.length; i++) c.lineTo(pts[i][0], pts[i][1]);
  c.closePath();
  if (width > 0) { c.lineWidth = width; c.strokeStyle = css(color); c.stroke(); }
  else { c.fillStyle = css(color); c.fill(); }
}
function drawLine(c, color, a, b, width = 1) {
  c.beginPath(); c.moveTo(a[0], a[1]); c.lineTo(b[0], b[1]);
  c.lineWidth = width; c.strokeStyle = css(color); c.stroke();
}
function drawLines(c, color, pts, width = 1) {
  c.beginPath(); c.moveTo(pts[0][0], pts[0][1]);
  for (let i = 1; i < pts.length; i++) c.lineTo(pts[i][0], pts[i][1]);
  c.lineWidth = width; c.strokeStyle = css(color); c.stroke();
}
// pygame arc: angles counter-clockwise (y up) from the +x axis
function drawArc(c, color, r, start, stop, width = 1) {
  const rad = Math.min(r.w, r.h) / 2 - width / 2;
  if (rad <= 0) return;
  c.beginPath();
  c.arc(r.x + r.w / 2, r.y + r.h / 2, rad, -start, -stop, true);
  c.lineWidth = width; c.strokeStyle = css(color); c.stroke();
}
function drawEllipse(c, color, r, width = 0) {
  c.beginPath();
  c.ellipse(r.x + r.w / 2, r.y + r.h / 2, Math.max(0.5, r.w / 2 - width / 2), Math.max(0.5, r.h / 2 - width / 2), 0, 0, TAU);
  if (width > 0) { c.lineWidth = width; c.strokeStyle = css(color); c.stroke(); }
  else { c.fillStyle = css(color); c.fill(); }
}

function drawShape(c, shape, color, pos, r) {
  const [x, y] = pos;
  if (shape === "circle") drawCircle(c, color, [x, y], r);
  else if (shape === "square") drawRect(c, color, new Rect(x - r, y - r, r * 2, r * 2), 0, 3);
  else if (shape === "diamond") drawPoly(c, color, [[x, y - r], [x + r, y], [x, y + r], [x - r, y]]);
  else if (shape === "triangle") drawPoly(c, color, [[x, y - r], [x + r, y + r], [x - r, y + r]]);
  else if (shape === "star") {
    const pts = [];
    for (let i = 0; i < 10; i++) {
      const rad = i % 2 === 0 ? r : r * 0.45;
      const a = -Math.PI / 2 + i * Math.PI / 5;
      pts.push([x + rad * Math.cos(a), y + rad * Math.sin(a)]);
    }
    drawPoly(c, color, pts);
  }
}

function spiky(pos, r, spikes = 8, rot = 0) {
  const [x, y] = pos; const pts = [];
  for (let i = 0; i < spikes * 2; i++) {
    const rad = i % 2 === 0 ? r : r * 0.55;
    const ang = rot + i * Math.PI / spikes;
    pts.push([x + rad * Math.cos(ang), y + rad * Math.sin(ang)]);
  }
  return pts;
}

/** Move an entity toward a point. Returns true once it has arrived. */
function moveToward(ent, tx, ty, speed, dt, game) {
  const dx = tx - ent.x, dy = ty - ent.y;
  const d = Math.hypot(dx, dy);
  const step = speed * game.tileSpeed(ent.x, ent.y) * dt;
  if (d <= step || d < 1) { ent.x = tx; ent.y = ty; return true; }
  ent.x += dx / d * step;
  ent.y += dy / d * step;
  return false;
}

// ------------------------------ ENTITIES --------------------------------
let UID = 0;

class Building {
  constructor(key, gx, gy, built = false) {
    this.uid = ++UID;
    this.key = key;
    this.d = BUILDINGS[key];
    this.size = this.d.size;
    this.gx = gx; this.gy = gy;
    this.x = (gx + this.size / 2) * TILE;
    this.y = (gy + this.size / 2) * TILE;
    this.max_hp = this.d.hp;
    this.built = built;
    this.progress = 0;
    this.hp = built ? this.max_hp : this.max_hp * 0.3;
    this.timer = 0;
    this.enabled = true;
    this.rally = null;
    this.builders = 0;
    this.hit_flash = 0;
    // infection state (the "building" is a cluster of host cells)
    this.strain = null;
    this.infection = 0;
    this.next_burst = 25;
    this.antiviral = 0;
    this.vessels = 0;   // capillary beds: blood-vessel tiles touched
  }
  get rect() { return new Rect(this.gx * TILE, this.gy * TILE, this.size * TILE, this.size * TILE); }
  tiles() {
    const out = [];
    for (let ty = this.gy; ty < this.gy + this.size; ty++)
      for (let tx = this.gx; tx < this.gx + this.size; tx++) out.push([tx, ty]);
    return out;
  }
  alive() { return this.hp > 0; }
  takeDamage(a) { this.hp -= a; this.hit_flash = 0.15; }
  addWork(amount, game) {
    const work = this.d.work;
    this.progress += amount;
    this.hp = Math.min(this.max_hp, this.hp + this.max_hp * 0.7 * amount / work);
    if (this.progress >= work && !this.built) { this.built = true; game.onBuilt(this); }
  }
  update(dt, game) {
    this.hit_flash = Math.max(0, this.hit_flash - dt);
    this.antiviral = Math.max(0, this.antiviral - dt);
    if (this.strain) {
      // the virus has hijacked these cells: no work, only virus production
      const rate = this.strain.replication * (this.antiviral > 0 ? 0.4 : 1.0);
      this.infection += rate * dt;
      while (this.infection >= this.next_burst && this.next_burst < 100) {
        this.next_burst += 25;
        game.releaseVirions(this.x, this.y, this.strain, 2);
      }
      if (this.infection >= 100) this.hp = 0;
      return;
    }
    if (!this.built || !this.enabled) return;
    const d = this.d;
    if (d.produce) {
      const consume = d.consume || {};
      const ok = Object.entries(consume).every(([r, amt]) => game.res[r] >= amt * dt);
      if (ok) {
        for (const [r, amt] of Object.entries(consume)) game.addRes(r, -amt * dt);
        for (const [r, amt] of Object.entries(d.produce)) game.addRes(r, amt * dt);
      }
    }
    if (d.supply) {
      const m = game.supplyMult(this);
      for (const [r, amt] of Object.entries(CAP_BASE)) game.addRes(r, amt * m * dt);
    }
    if (d.zap) {
      const z = d.zap;
      this.timer += dt;
      if (this.timer >= z.cd) {
        const v = game.nearestVirion([this.x, this.y], z.range);
        if (v) {
          this.timer = 0;
          v.hit(z.dmg + game.zap_bonus, game);
          game.fx.push({ kind: "shot", x: this.x, y: this.y, x2: v.x, y2: v.y, t: 0.15, life: 0.15, color: [200, 170, 255] });
        }
      }
    }
    if (d.unit) {
      if (d.adaptive && game.active.size === 0) { this.timer = 0; return; }
      if (d.max && game.units.filter(u => u.home === this).length >= d.max) { this.timer = 0; return; }
      let cd = d.spawn_cd * (game.inAura(this.x, this.y) ? 0.7 : 1.0);
      if (!d.adaptive) cd *= game.innate_cd_mult;
      this.timer += dt;
      if (this.timer >= cd) {
        if (game.canAfford(d.spawn_cost) && game.pop() < game.pop_cap) {
          game.spend(d.spawn_cost);
          this.timer = 0;
          game.spawnImmune(d.unit, this);
        } else {
          this.timer = cd;
        }
      }
    }
  }
}

/** A free virus particle. Can't attack - it drifts, attaches to a host cell and
 *  infects it. Falls apart if it stays outside a cell too long. */
class Virion {
  constructor(strain, x, y) {
    this.strain = strain;
    this.max_hp = strain.hp;
    this.hp = this.max_hp;
    this.speed = strain.speed * R.uniform(0.85, 1.15);
    this.color = strain.color;
    this.x = x; this.y = y;
    this.life = VIRION_LIFE;
    this.neutralized = false;
    this.rot = R.uniform(0, TAU);
    this.wander = R.uniform(0, TAU);
  }
  alive() { return this.hp > 0 && this.life > 0; }
  hit(dmg, game) {
    if (this.hp <= 0) return;
    if (this.neutralized) dmg *= 2;   // opsonization: antibody-coated virus is easy to eat
    this.hp -= dmg;
    if (this.hp <= 0) game.onVirionDestroyed(this);
  }
  consume() { this.hp = 0; }
  update(dt, game) {
    this.life -= dt * (this.neutralized ? 5 : 1);
    this.rot += dt * 1.5;
    this.wander += R.uniform(-2.5, 2.5) * dt;
    this.x = clamp(this.x, 2, WORLD_W - 2);
    this.y = clamp(this.y, 2, WORLD_H - 2);

    if (this.neutralized) {
      this.step(this.x + Math.cos(this.wander) * 30, this.y + Math.sin(this.wander) * 30,
                this.speed * 0.4, dt, game, false);
      return;
    }
    const host = game.nearestHost([this.x, this.y], 170);
    if (host) {
      if (host instanceof Worker) {
        if (dist([this.x, this.y], [host.x, host.y]) <= 9) {
          game.infect(host, this.strain);
          this.consume();
          return;
        }
      }
      this.step(host.x, host.y, this.speed, dt, game);
      return;
    }
    const gx = Math.floor(this.x / TILE), gy = Math.floor(this.y / TILE);
    if (game.bgrid[gy][gx] === game.core) { game.virionReachesCore(this); return; }
    const nxt = game.flowNext(gx, gy);
    if (!nxt) return;
    const tx = (nxt[0] + 0.5) * TILE + Math.cos(this.wander) * 8;
    const ty = (nxt[1] + 0.5) * TILE + Math.sin(this.wander) * 8;
    this.step(tx, ty, this.speed, dt, game);
  }
  step(tx, ty, spd, dt, game, infect = true) {
    const ox = this.x, oy = this.y;
    const cur = game.buildingAt(ox, oy);
    moveToward(this, tx, ty, spd, dt, game);
    const b = game.buildingAt(this.x, this.y);
    if (b && b !== cur) {
      this.x = ox; this.y = oy;
      if (!infect) this.wander += Math.PI;
      else if (b === game.core) game.virionReachesCore(this);
      else { game.infect(b, this.strain); this.consume(); }
    }
  }
}

/** A friendly immune cell. */
class Immune {
  constructor(key, x, y, game, home) {
    this.key = key;
    const base = CELL_TYPES[key];
    this.role = base.role;
    this.max_hp = base.hp;
    this.hp = this.max_hp;
    this.dmg = base.dmg * game.dmg_mods[key];
    this.speed = base.speed;
    this.rng = base.rng;
    this.atk_cd = base.atk_cd;
    this.color = base.color;
    this.shape = base.shape;
    this.life = base.life ?? null;
    this.x = x; this.y = y;
    this.home = home;
    this.post = game.postFor(home);
    this.target = null;
    this.move_target = null;
    this.manual = false;
    this.selected = false;
    this.carrying = null;   // dendritic cell: antigen being carried
    this.cd = 0;
  }
  alive() { return this.hp > 0; }
  update(dt, game) {
    this.cd = Math.max(0, this.cd - dt);
    if (this.life !== null) {
      this.life -= dt;
      if (this.life <= 0) { this.hp = 0; return; }
    }
    if (this.carrying) {
      const core = game.core;
      if (dist([this.x, this.y], [core.x, core.y]) <= core.size * TILE / 2 + 12) {
        game.presentAntigen(this.carrying, "dc");
        this.carrying = null;
      } else {
        moveToward(this, core.x, core.y, this.speed, dt, game);
      }
      return;
    }
    if (this.manual) {
      if (this.target && !game.targetAlive(this.target, this)) {
        this.target = null;
        if (!this.move_target) this.manual = false;
      }
      if (!this.target && this.move_target) {
        if (moveToward(this, this.move_target[0], this.move_target[1], this.speed, dt, game)) {
          this.post = this.move_target;
          this.move_target = null;
          this.manual = false;
        }
        return;
      }
    }
    const enemy = (this.manual && this.target) ? this.target : this.findTarget(game);
    if (enemy) {
      const d = dist([this.x, this.y], [enemy.x, enemy.y]);
      const reach = this.rng + (enemy instanceof Building ? enemy.size * TILE / 2 : 0);
      if (d <= reach) { if (this.cd <= 0) this.act(enemy, game); }
      else moveToward(this, enemy.x, enemy.y, this.speed, dt, game);
      return;
    }
    if (dist([this.x, this.y], this.post) > 6)
      moveToward(this, this.post[0], this.post[1], this.speed * 0.8, dt, game);
  }
  findTarget(game) {
    const p = [this.x, this.y];
    let t;
    if (this.role === "eat") t = game.nearestVirion(p, 220, true);
    else if (this.role === "antibody") t = game.nearestVirion(p, 240, false, true);
    // chemokines released by infected tissue recruit killers from far away
    else if (this.role === "kill") t = game.nearestInfected(p, 520, this.key === "killer_t");
    else t = game.nearestNewAntigen(p, 240);
    const leash = LEASH * (this.role === "kill" ? 1.6 : 1.0);
    if (t && dist([t.x, t.y], this.post) > leash) return null;
    return t;
  }
  act(t, game) {
    const mult = game.auraMult(this.x, this.y);
    this.cd = this.atk_cd;
    if (this.role === "eat") {
      t.hit(this.dmg * mult, game);
      game.fx.push({ kind: "hit", x: t.x, y: t.y, t: 0.15, life: 0.15, color: WHITE });
    } else if (this.role === "antibody") {
      t.neutralized = true;
      t.hit(this.dmg * mult, game);
      this.cd = this.atk_cd * game.ab_cd_mult;
      game.fx.push({ kind: "shot", x: this.x, y: this.y, x2: t.x, y2: t.y, t: 0.2, life: 0.2, color: IFN_COL });
    } else if (this.role === "kill") {
      let m = 1.0;
      if (this.key === "nk") m = t.strain.traits.includes("mhc_down") ? 2.0 : 0.6;
      game.killInfected(t, this.dmg * mult * m);
    } else if (this.role === "present") {
      if (t instanceof Virion) t.consume();
      this.carrying = t.strain.antigen;
      game.fx.push({ kind: "order", x: t.x, y: t.y, t: 0.4, life: 0.4, color: CYAN });
    }
  }
}

/** A colonist tissue cell (fibroblast). Picks its own jobs: build or repair.
 *  It doesn't fetch food - the blood delivers nutrients through capillaries.
 *  Can be infected - then it stops working and later bursts. */
class Worker {
  constructor(x, y) {
    this.x = x; this.y = y;
    this.max_hp = WORKER_DEF.hp;
    this.hp = this.max_hp;
    this.job = null;
    this.home = null;   // where it rests when idle
    this.think = R.uniform(0, 0.4);
    this.selected = false;
    this.strain = null;
    this.eclipse = 0;
    this.antiviral = 0;
    this.size = 0;
  }
  alive() { return this.hp > 0; }
  release() {
    if (this.job) this.job[1].builders = Math.max(0, this.job[1].builders - 1);
    this.job = null;
  }
  status(medical) {
    if (this.strain) return `INFECTED - will burst in ${Math.max(0, Math.trunc(this.eclipse))}s`;
    if (!this.job) return "Resting (fed by the blood)";
    const [k, b] = this.job;
    return (k === "build" ? "Building " : "Repairing ") + nm(b.d, medical);
  }
  update(dt, game) {
    this.antiviral = Math.max(0, this.antiviral - dt);
    if (this.strain) {
      this.eclipse -= dt * (this.antiviral > 0 ? 0.5 : 1.0);
      if (this.eclipse <= 0) game.workerBursts(this);
      return;
    }
    const speed = WORKER_DEF.speed * game.work_mult;
    if (!this.job) {
      this.think -= dt;
      if (this.think <= 0) { this.think = 0.4; game.assignJob(this); }
      if (!this.job) {
        if (!this.home) {
          const ang = R.uniform(0, TAU), r = R.uniform(50, 80);
          this.home = [game.core.x + Math.cos(ang) * r, game.core.y + Math.sin(ang) * r];
        }
        moveToward(this, this.home[0], this.home[1], speed * 0.5, dt, game);
      }
      return;
    }
    this.home = null;
    const [kind, b] = this.job;
    if (!b.alive() || !game.buildings.includes(b) || b.strain ||
        (kind === "build" && b.built) || (kind === "repair" && b.hp >= b.max_hp)) {
      this.release();
      return;
    }
    if (dist([this.x, this.y], [b.x, b.y]) <= b.size * TILE / 2 + 10) {
      if (kind === "build") b.addWork(dt * game.work_mult, game);
      else b.hp = Math.min(b.max_hp, b.hp + 14 * dt * game.work_mult);
    } else {
      moveToward(this, b.x, b.y, speed, dt, game);
    }
  }
}
