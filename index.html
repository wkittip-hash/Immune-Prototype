  // ================================ input ================================
  handleClick(x, y) {
    for (let i = this.click_targets.length - 1; i >= 0; i--) {
      const [rect, action] = this.click_targets[i];
      if (rect.collidepoint(x, y)) { action(); return true; }
    }
    return false;
  }
  go(state) {
    if (state === "HOWTO" || state === "OPTIONS") { this.prev_state = this.state; this.howto_page = 0; }
    if (state === "LEARN" && this.state !== "HOWTO") { this.learn_tab = this.learn_tab || "Colony"; this.learn_entry = null; }
    this.state = state;
  }
  /** Main menu "Play": resume a running game, otherwise start a new run. */
  play() {
    if (this.has_game && this.core && this.core.hp > 0 && !this.tut) this.state = "PLAYING";
    else this.newGame();
  }

  handleKey(key) {
    if (key === "m") this.medical = !this.medical;
    const st = this.state;
    if (st === "HOWTO" || st === "OPTIONS") {
      if (key === "escape") {
        if (this.lang_open) this.lang_open = false;
        else this.state = this.prev_state;
      }
      return;
    }
    if (st === "LEARN") {
      if (key === "escape") { if (this.learn_entry) this.learn_entry = null; else this.state = "MENU"; }
      return;
    }
    if (st === "MENU") { if (key === "enter") this.play(); return; }
    if (st === "PAUSED") { if (key === "escape") this.state = "PLAYING"; return; }
    if (st === "ADAPT") { if (key === "enter" || key === "escape") this.state = "PLAYING"; return; }
    if (st !== "PLAYING") return;
    if (this.tutCard()) {
      if (key === "enter" || key === " ") this.tutGo(this.tut.i + 1);
      return;
    }

    if (key === "escape") {
      if (this.build_key) this.build_key = null;
      else if (this.sel_building || this.sel_worker || this.units.some(u => u.selected)) this.clearSelection();
      else this.state = "PAUSED";
    } else if (key === " ") this.paused = !this.paused;
    else if (key === "tab") this.setTab(TAB_ORDER[(TAB_ORDER.indexOf(this.tab) + 1) % TAB_ORDER.length]);
    else if (key === "=" || key === "+") this.speed = Math.min(3, this.speed + 1);
    else if (key === "-") this.speed = Math.max(1, this.speed - 1);
    else if (key === "g") this.growWorker();
    else if (key === "n") this.callWaveEarly();
    else if (key === "h") this.centerOn(this.core.x, this.core.y);
    else if (key === "f") { this.clearSelection(); for (const u of this.units) u.selected = true; }
    else if (key === "delete" && this.sel_building) this.demolish(this.sel_building);
    else if (key >= "1" && key <= "5" && key.length === 1) {
      const i = Number(key) - 1;
      if (i < TABS[this.tab].length) this.selectBuild(TABS[this.tab][i]);
    }
  }

  selectBuild(key) {
    if (!this.unlocked(key)) {
      this.alert(`${this.name(BUILDINGS[key])} unlocks after wave ${UNLOCK_AT[key]}.`, ORANGE, "locked", 1.5);
      return;
    }
    this.build_key = this.build_key === key ? null : key;
    this.clearSelection();
  }
  clearSelection() {
    this.sel_building = null;
    this.sel_worker = null;
    for (const u of this.units) u.selected = false;
  }
  centerOn(x, y) {
    this.cam_x = clamp(x - VIEW_W / 2, 0, WORLD_W - VIEW_W);
    this.cam_y = clamp(y - VIEW_H / 2, 0, WORLD_H - VIEW_H);
  }
  ghostOrigin(wx, wy, key) {
    const s = BUILDINGS[key].size;
    return [Math.round(wx / TILE - s / 2), Math.round(wy / TILE - s / 2)];
  }
  canPlace(key, gx, gy) {
    const d = BUILDINGS[key];
    const s = d.size;
    for (let ty = gy; ty < gy + s; ty++) {
      for (let tx = gx; tx < gx + s; tx++) {
        if (tx < 0 || tx >= MAP_W || ty < 0 || ty >= MAP_H) return [false, "Out of bounds."];
        if (this.bgrid[ty][tx]) return [false, "That space is occupied."];
        if (this.tiles[ty][tx] === T_VESSEL && !d.wall) return [false, "Only Barrier Walls can go on blood vessels."];
      }
    }
    if (d.supply && this.vesselsTouching(gx, gy, s) === 0)
      return [false, "A Capillary Bed must touch a blood vessel (dark red tiles)."];
    if (!this.canAfford(d.cost)) return [false, "Not enough resources."];
    return [true, ""];
  }
  tryPlace(wx, wy, quiet = false) {
    const key = this.build_key;
    const [gx, gy] = this.ghostOrigin(wx, wy, key);
    const [ok, why] = this.canPlace(key, gx, gy);
    if (!ok) { if (!quiet) this.alert(why, ORANGE); return; }
    this.spend(BUILDINGS[key].cost);
    this.placeBuilding(new Building(key, gx, gy));
  }

  worldMouseDown(button, pos) {
    if (this.tutCard()) return;
    const [wx, wy] = this.s2w(...pos);
    if (button === 2) { this.pan_drag = [pos, this.cam_x, this.cam_y]; return; }
    if (button === 1) {
      if (this.build_key) {
        this.tryPlace(wx, wy);
        this.painting = !!BUILDINGS[this.build_key].wall;
      } else {
        this.drag_start = pos;
        this.drag_rect = null;
      }
    } else if (button === 3) {
      if (this.build_key) { this.build_key = null; return; }
      const sel = this.units.filter(u => u.selected);
      if (sel.length) {
        let target = null;
        for (const v of this.virions) if (dist([wx, wy], [v.x, v.y]) < 16) { target = v; break; }
        if (!target) for (const v of this.bacteria) if (dist([wx, wy], [v.x, v.y]) < 16) { target = v; break; }
        if (!target) for (const d of this.debris) if (dist([wx, wy], [d.x, d.y]) < 16) { target = d; break; }
        if (!target) for (const c of this.cancers) if (dist([wx, wy], [c.x, c.y]) < 14) { target = c; break; }
        if (!target) {
          for (const c of this.infectedCells()) {
            const r = c instanceof Worker ? 12 : c.size * TILE / 2;
            if (dist([wx, wy], [c.x, c.y]) <= r) { target = c; break; }
          }
        }
        for (const u of sel) {
          u.manual = true;
          if (target && this.targetAlive(target, u)) { u.target = target; u.move_target = null; }
          else { u.target = null; u.move_target = [wx + R.uniform(-14, 14), wy + R.uniform(-14, 14)]; }
        }
        this.fx.push({ kind: "order", x: wx, y: wy, t: 0.5, life: 0.5, color: target ? RED : GREEN });
      } else if (this.sel_building && this.sel_building.d.unit) {
        const b = this.sel_building;
        b.rally = [wx, wy];
        for (const u of this.units) if (u.home === b && !u.manual) u.post = this.postFor(b);
        this.fx.push({ kind: "order", x: wx, y: wy, t: 0.5, life: 0.5, color: CYAN });
      }
    }
  }
  mouseUp(button, pos, shift) {
    if (button === 2) this.pan_drag = null;
    if (button !== 1) return;
    this.painting = false;
    this.mm_drag = false;
    if (!this.drag_start) return;
    const start = this.drag_start;
    this.drag_start = null;
    const r = this.drag_rect;
    this.drag_rect = null;
    if (r && (r.w > 4 || r.h > 4)) {
      if (!shift) this.clearSelection();
      for (const u of this.units) { const [sx, sy] = this.w2s(u.x, u.y); if (r.collidepoint(sx, sy)) u.selected = true; }
      return;
    }
    const [wx, wy] = this.s2w(...start);
    if (!shift) this.clearSelection();
    for (const u of this.units) if (dist([wx, wy], [u.x, u.y]) < 16) { u.selected = true; return; }
    for (const w of this.workers) if (dist([wx, wy], [w.x, w.y]) < 13) { this.sel_worker = w; return; }
    const b = this.buildingAt(wx, wy);
    if (b) this.sel_building = b;
  }
  mouseMotion(pos) {
    if (this.state !== "PLAYING") return;
    if (this.pan_drag) {
      const [[sx, sy], cx, cy] = this.pan_drag;
      this.cam_x = clamp(cx - (pos[0] - sx), 0, WORLD_W - VIEW_W);
      this.cam_y = clamp(cy - (pos[1] - sy), 0, WORLD_H - VIEW_H);
    }
    if (this.mm_drag) this.minimapJump(pos);
    if (this.painting && this.build_key && VIEW_RECT.collidepoint(...pos)) this.tryPlace(...this.s2w(...pos), true);
    if (this.drag_start) {
      const [sx, sy] = this.drag_start;
      this.drag_rect = new Rect(Math.min(sx, pos[0]), Math.min(sy, pos[1]), Math.abs(pos[0] - sx), Math.abs(pos[1] - sy));
    }
  }
  minimapRect() { return new Rect(WIDTH - MM_W - 10, HEIGHT - BOTTOM_H + 6, MM_W, MM_H); }
  minimapJump(pos) {
    const r = this.minimapRect();
    const fx = clamp((pos[0] - r.x) / MM_W, 0, 1);
    const fy = clamp((pos[1] - r.y) / MM_H, 0, 1);
    this.centerOn(fx * WORLD_W, fy * WORLD_H);
  }
  startMinimapDrag() { this.mm_drag = true; this.minimapJump(input.mouse); }

  // =========================== drawing: world ============================
  drawWorld() {
    ctx.save();
    ctx.beginPath(); ctx.rect(VIEW_RECT.x, VIEW_RECT.y, VIEW_RECT.w, VIEW_RECT.h); ctx.clip();
    const cx = Math.trunc(this.cam_x), cy = Math.trunc(this.cam_y);
    ctx.drawImage(this.map, cx * DPR, cy * DPR, VIEW_W * DPR, VIEW_H * DPR, 0, TOP_H, VIEW_W, VIEW_H);

    this.drawEntryMarkers();
    const sel_b = this.sel_building;
    if (sel_b && sel_b.d.boost) this.drawRing(sel_b.x, sel_b.y, sel_b.d.boost, [225, 95, 110]);
    if (this.build_key === "arteriole" || this.build_key === "hub")
      for (const b of this.buildings) if (b.d.boost) this.drawRing(b.x, b.y, b.d.boost, [225, 95, 110]);
    if (sel_b && sel_b.d.aura) this.drawRing(sel_b.x, sel_b.y, sel_b.d.aura, [255, 185, 70]);
    if (this.build_key && BUILDINGS[this.build_key].aura)
      for (const b of this.buildings) if (b.d.aura) this.drawRing(b.x, b.y, b.d.aura, [255, 185, 70]);

    for (const b of this.buildings) this.drawBuilding(b);
    for (const n of this.nets) this.drawNet(n);
    for (const d of this.debris) this.drawDebris(d);
    for (const w of this.workers) this.drawWorker(w);
    for (const c of this.cancers) {
      const [sx, sy] = this.w2s(c.x, c.y);
      if (!this.visible(sx, sy)) continue;
      drawCellSprite(ctx, "cancer", sx, sy, SPRITE_R.cancer,
                     { t: this.time * 1.6, phase: c.phase, punch: c.div < 0.5 ? 1 - c.div * 2 : 0 });
      if (c.hp < c.max_hp) this.drawHp(sx, sy - 18, 16, c.hp / c.max_hp, [220, 80, 120]);
    }
    for (const u of this.units) this.drawUnit(u);
    for (const v of this.virions) this.drawVirion(v);
    for (const v of this.bacteria) this.drawBacterium(v);
    this.drawFx();

    if (sel_b && sel_b.rally) {
      const a = this.w2s(sel_b.x, sel_b.y), b = this.w2s(...sel_b.rally);
      drawLine(ctx, CYAN, a, b, 1);
      drawCircle(ctx, CYAN, b, 6, 2);
    }
    this.drawGhost();
    if (this.drag_rect) {
      const r = this.drag_rect;
      drawRect(ctx, "rgba(90,200,255,0.2)", r);
      drawRect(ctx, [90, 200, 255], r, 1);
    }
    ctx.restore();
  }
  drawRing(x, y, r, color) {
    const [sx, sy] = this.w2s(x, y);
    drawCircle(ctx, css(color, 20 / 255), [sx, sy], r);
    drawCircle(ctx, css(color, 120 / 255), [sx, sy], r, 2);
  }
  visible(sx, sy, pad = 40) {
    return -pad < sx && sx < VIEW_W + pad && TOP_H - pad < sy && sy < TOP_H + VIEW_H + pad;
  }
  drawEntryMarkers() {
    const idxs = this.wave_active ? this.active_entries : this.next_entries;
    const pulse = 0.5 + 0.5 * Math.sin(this.time * 5);
    for (const i of idxs) {
      const e = this.entries[i];
      const [sx, sy] = this.w2s(e.x, e.y);
      if (this.visible(sx, sy)) {
        drawCircle(ctx, RED, [sx, sy], Math.trunc(18 + pulse * 8), 3);
        this.text("!", this.f_med, RED, sx, sy - 14, "c");
      }
    }
  }
  drawHp(x, y, w, frac, color) {
    drawRect(ctx, [30, 20, 24], new Rect(x - Math.floor(w / 2), y, w, 4));
    drawRect(ctx, color, new Rect(x - Math.floor(w / 2), y, Math.trunc(w * clamp(frac, 0, 1)), 4));
  }
  drawBuilding(b) {
    const r = b.rect.move(-Math.trunc(this.cam_x), -Math.trunc(this.cam_y) + TOP_H);
    if (!r.colliderect(VIEW_RECT)) return;
    const col = b.d.color;
    const inner = r.inflate(-4, -4);
    if (!b.built) {
      drawRect(ctx, css(col, 55 / 255), inner);
      drawRect(ctx, col, inner, 2, 6);
      this.drawHp(r.centerx, r.bottom - 8, inner.w - 8, b.progress / b.d.work, CYAN);
      if (b.builders === 0 && b.size > 1) this.text("queued", this.f_small, GREY, r.centerx, r.centery - 8, "c");
    } else {
      const k = b.key;
      if (k === "barrier") {
        drawRect(ctx, darker(col, 0.55), r.inflate(-2, -2), 0, 5);
        drawRect(ctx, col, r.inflate(-6, -10), 0, 4);
        for (let i = 0; i < 4; i++) {
          const x = r.x + 6 + i * 7;
          drawCircle(ctx, [250, 200, 220], [x, r.y + 6], 3);
          drawCircle(ctx, [250, 200, 220], [x, r.bottom - 6], 3);
        }
      } else if (k === "core") {
        const pulse = 0.5 + 0.5 * Math.sin(this.time * 2);
        drawRect(ctx, darker(col, 0.5), r.inflate(10, 10), 0, 18);
        drawRect(ctx, col, r, 0, 14);
        drawRect(ctx, [200, 170, 255], r, 2, 14);
        drawCircle(ctx, [170, 140, 235], [r.centerx, r.centery], Math.trunc(22 + pulse * 6), 3);
        this.text(this.medical ? "LYMPH NODE" : "CORE", this.medical ? this.f_small : this.f_bold,
                  WHITE, r.centerx, r.centery - 10, "c");
        if ([...this.antigens.values()].some(st => st.state === "learning"))
          drawCircle(ctx, CYAN, [r.centerx, r.centery], Math.trunc(34 + pulse * 6), 2);
        this.drawHqFlag(r.right - 12, r.y + 8, 1);
      } else if (k === "hub") {
        drawRect(ctx, darker(col, 0.5), inner, 0, 6);
        drawCircle(ctx, col, [inner.centerx, inner.centery], 9);
        drawCircle(ctx, [255, 150, 160], [inner.centerx, inner.centery], 4);
        if (b.enabled) {
          // glucose (yellow) and amino acids (green) seeping out of the blood
          const ph = (this.time * 0.8 + b.gx * 0.37) % 1.0;
          [YELLOW, GREEN].forEach((c, i) => {
            const a = ph * TAU + i * Math.PI, rr = 6 + ph * 12;
            drawCircle(ctx, c, [Math.trunc(inner.centerx + Math.cos(a) * rr), Math.trunc(inner.centery + Math.sin(a) * rr)], 2);
          });
        }
      } else {
        drawRect(ctx, darker(col, 0.5), inner, 0, 9);
        drawRect(ctx, col, inner.inflate(-6, -6), 0, 7);
        const cx = inner.centerx, cy = inner.centery;
        const dk = darker(col, 0.45);
        if (k === "liver") {
          const pts = [];
          for (let i = 0; i < 6; i++) pts.push([cx + 13 * Math.cos(i * Math.PI / 3), cy + 13 * Math.sin(i * Math.PI / 3)]);
          drawPoly(ctx, dk, pts, 3);
          drawCircle(ctx, dk, [cx, cy], 4);
        } else if (k === "arteriole") {
          drawRect(ctx, dk, new Rect(cx - 18, cy - 7, 36, 14), 3, 7);
          const pulse = 0.5 + 0.5 * Math.sin(this.time * 4);
          drawCircle(ctx, [255, 160, 170], [Math.trunc(cx - 12 + pulse * 24), cy], 3);
        } else if (k === "house") {
          for (const [ox, oy] of [[-8, 4], [8, 4], [0, -8]]) {
            drawCircle(ctx, [255, 230, 240], [cx + ox, cy + oy], 7);
            drawCircle(ctx, dk, [cx + ox, cy + oy], 7, 2);
          }
        } else if (k === "helper") {
          drawCellSprite(ctx, "helper", cx, cy + 3, 13, { t: this.time, phase: b.uid });
        } else if (b.d.unit) {
          const waiting = b.d.adaptive && this.active.size === 0;
          drawCellSprite(ctx, b.d.unit, cx, cy + 2, 12,
                         { t: this.time, phase: b.uid, alpha: waiting ? 0.5 : 1, still: waiting });
          if (waiting) this.text("waiting", this.f_small, WHITE, cx, cy + 14, "c");
          else if (b.enabled && !b.strain)
            drawArc(ctx, WHITE, inner.inflate(-10, -10), Math.PI / 2,
                    Math.PI / 2 + TAU * Math.min(1, b.timer / b.d.spawn_cd), 2);
        }
        if (!b.enabled) this.text("OFF", this.f_bold, [255, 120, 120], cx, cy - 10, "c");
      }
    }
    if (b.antiviral > 0 && !b.strain && b !== this.core) drawRect(ctx, IFN_COL, r.inflate(2, 2), 1, 8);
    if (b.strain) {
      const pulse = 0.5 + 0.5 * Math.sin(this.time * 6);
      drawRect(ctx, css(INFECT, (90 + 60 * pulse) / 255), r);
      const rng = makeRng(b.uid * 2654435761);
      for (let i = 0; i < 2 + Math.trunc(b.infection / 20); i++) {
        const px = r.x + rng.randint(6, r.w - 6), py = r.y + rng.randint(6, r.h - 6);
        drawCellSprite(ctx, "virion", px, py, 3.5, { t: this.time, phase: i, color: b.strain.color });
      }
      this.drawHp(r.centerx, r.bottom + 3, r.w - 4, b.infection / 100, INFECT);
    }
    if (b === this.sel_building) drawRect(ctx, WHITE, r.inflate(4, 4), 2, 8);
    if (b.hit_flash > 0) drawRect(ctx, [255, 90, 90], r, 3, 8);
    if (b.hp < b.max_hp) this.drawHp(r.centerx, r.y - 7, r.w - 4, b.hp / b.max_hp, GREEN);
  }
  drawWorker(w) {
    const [sx, sy] = this.w2s(w.x, w.y);
    if (!this.visible(sx, sy)) return;
    const state = w.strain ? "infected" : w.antiviral > 0 ? "ifn" : "";
    drawCellSprite(ctx, "worker", sx, sy, SPRITE_R.worker,
                   { t: this.time, phase: w.phase, state, flip: this.facing(w) < 0, still: !!w.strain });
    if (w.strain) {
      const frac = clamp(w.eclipse / w.strain.eclipse, 0, 1);
      drawArc(ctx, RED, new Rect(sx - 15, sy - 15, 30, 30), Math.PI / 2, Math.PI / 2 + TAU * frac, 2);
    }
    if (w === this.sel_worker) drawCircle(ctx, WHITE, [sx, sy], 17, 1);
  }
  drawUnit(u) {
    const [sx, sy] = this.w2s(u.x, u.y);
    if (!this.visible(sx, sy)) return;
    const r = SPRITE_R[u.key];
    if (u.selected) {
      drawCircle(ctx, "rgba(255,255,255,0.12)", [sx, sy], r + 6);
      drawCircle(ctx, WHITE, [sx, sy], r + 6, 2);
    }
    const state = u.enraged ? "enraged" : u.carrying ? "carry" : "";
    drawCellSprite(ctx, u.key, sx, sy, r,
                   { t: this.time, phase: u.phase, state, punch: u.punch, flip: this.facing(u) < 0 });
    if (u.hp < u.max_hp) this.drawHp(sx, sy - Math.round(r * 1.7) - 6, 20, u.hp / u.max_hp, GREEN);
  }
  drawVirion(v) {
    if (!v.alive()) return;
    const [sx, sy] = this.w2s(v.x, v.y);
    if (!this.visible(sx, sy)) return;
    const alpha = v.life < 8 ? clamp(v.life / 8, 0.2, 1) : 1;
    drawCellSprite(ctx, "virion", sx, sy, SPRITE_R.virion,
                   { t: this.time, phase: v.wander, rot: v.rot, color: v.color, alpha,
                     state: v.neutralized ? "tagged" : "", flip: this.facing(v) < 0 });
    if (v.neutralized) {
      // antibodies (Y shapes with pincers) clamped onto the virus
      ctx.save(); ctx.globalAlpha = alpha; ctx.lineCap = "round";
      for (const a of [v.rot, v.rot + 2.1, v.rot + 4.2]) {
        const px = sx + Math.cos(a) * 13, py = sy + Math.sin(a) * 13;
        sprY(ctx, px, py, 4, a + Math.PI, [255, 214, 90], 0.5);
      }
      ctx.restore();
    }
    if (v.slow > 0) drawCircle(ctx, "rgba(150,200,255,0.7)", [sx, sy], 12, 1);
  }
  drawBacterium(v) {
    if (!v.alive()) return;
    const [sx, sy] = this.w2s(v.x, v.y);
    if (!this.visible(sx, sy)) return;
    let a = v.ang || 0;
    const left = Math.cos(a) < 0;
    if (left) a += Math.PI;
    ctx.save(); ctx.translate(sx, sy); ctx.rotate(a);
    drawCellSprite(ctx, "bacterium", 0, 0, SPRITE_R.bacterium,
                   { t: this.time, phase: v.wander, flip: left, state: v.neutralized ? "tagged" : "" });
    ctx.restore();
    if (v.neutralized) {
      ctx.save(); ctx.lineCap = "round";
      for (const an of [this.time, this.time + 2.1, this.time + 4.2]) {
        sprY(ctx, sx + Math.cos(an) * 14, sy + Math.sin(an) * 14, 4, an + Math.PI, [255, 214, 90], 0.5);
      }
      ctx.restore();
    }
    if (v.slow > 0) drawCircle(ctx, "rgba(150,200,255,0.7)", [sx, sy], 13, 1);
    if (v.hp < v.max_hp) this.drawHp(sx, sy - 16, 16, v.hp / v.max_hp, BACT_COLOR);
  }
  /** +1 facing right, -1 facing left: follows the last horizontal movement. */
  facing(e) {
    if (e._lx !== undefined) {
      const dx = e.x - e._lx;
      if (Math.abs(dx) > 0.05) e._face = dx < 0 ? -1 : 1;
    }
    e._lx = e.x;
    return e._face || 1;
  }
  drawNet(n) {
    const [sx, sy] = this.w2s(n.x, n.y);
    if (!this.visible(sx, sy, 60)) return;
    const a = clamp(n.t / 0.8, 0, 1) * 0.85;
    const grow = clamp((NET_TIME - n.t) / 0.25, 0.2, 1);
    const pts = [];
    for (let i = 0; i < 9; i++) {
      const ang = n.seed + i / 9 * TAU, rr = n.r * grow * (0.75 + 0.25 * Math.sin(i * 2.3 + n.seed));
      pts.push([sx + Math.cos(ang) * rr, sy + Math.sin(ang) * rr]);
    }
    ctx.save(); ctx.globalAlpha = a;
    drawCircle(ctx, "rgba(110,170,255,0.12)", [sx, sy], n.r * grow);
    for (let i = 0; i < pts.length; i++) {
      drawLine(ctx, [150, 200, 255], [sx, sy], pts[i], 1);
      drawLine(ctx, [150, 200, 255], pts[i], pts[(i + 1) % pts.length], 1);
      drawLine(ctx, [110, 160, 240], pts[i], pts[(i + 3) % pts.length], 1);
      drawCircle(ctx, [210, 230, 255], pts[i], 2.5);
    }
    ctx.restore();
  }
  drawDebris(d) {
    const [sx, sy] = this.w2s(d.x, d.y);
    if (!this.visible(sx, sy)) return;
    const warn = d.t < 6 && Math.sin(this.time * 12) > 0;
    for (let i = 0; i < 4; i++) {
      const a = d.seed + i * 1.7, rr = i ? 6 : 0;
      const bx = sx + Math.cos(a) * rr, by = sy + Math.sin(a) * rr + Math.sin(this.time * 2 + i) * 1.2;
      const br = i ? 4.5 : 6;
      drawCircle(ctx, [44, 22, 46], [bx, by], br);
      drawCircle(ctx, warn ? RED : [246, 150, 196], [bx, by], br, 2);
      drawCircle(ctx, d.strain.color, [bx + 1, by - 1], 1.3);
      drawCircle(ctx, [110, 150, 255], [bx - 1.5, by + 1], 1);
    }
    const frac = clamp(d.t / DEBRIS_TIME, 0, 1);
    drawArc(ctx, warn ? RED : [255, 190, 120], new Rect(sx - 14, sy - 14, 28, 28), Math.PI / 2, Math.PI / 2 + TAU * frac, 2);
  }
  /** The lymph node's HQ banner (x, y = top of the pole's base). */
  drawHqFlag(x, y, s) {
    const top = y - 34 * s;
    drawLine(ctx, [230, 220, 240], [x, y], [x, top], Math.max(1, 2 * s));
    drawCircle(ctx, [250, 210, 90], [x, top], 2.5 * s);
    const pts = [], w = 26 * s, h = 16 * s;
    for (let i = 0; i <= 6; i++) pts.push([x + w * i / 6, top + 2 * s + Math.sin(this.time * 4 - i * 0.9) * 2.5 * s * i / 6]);
    for (let i = 6; i >= 0; i--) pts.push([x + w * i / 6, top + 2 * s + h + Math.sin(this.time * 4 - i * 0.9) * 2.5 * s * i / 6]);
    drawPoly(ctx, [150, 110, 230], pts);
    drawPoly(ctx, [40, 24, 60], pts, 1);
    ctx.save(); ctx.lineCap = "round";
    sprY(ctx, x + w * 0.5, top + 2 * s + h * 0.62, 5.5 * s, -Math.PI / 2, WHITE, 0.4);
    ctx.restore();
  }
  drawFx() {
    for (const f of this.fx) {
      const a = f.t / f.life;
      const [sx, sy] = this.w2s(f.x, f.y);
      const k = f.kind;
      if (k === "shot") drawLine(ctx, f.color, [sx, sy], this.w2s(f.x2, f.y2), 2);
      else if (k === "hit") drawCircle(ctx, f.color, [sx, sy], Math.trunc(4 + (1 - a) * 6), 1);
      else if (k === "pop") drawCircle(ctx, f.color, [sx, sy], Math.trunc(6 + (1 - a) * 22), 2);
      else if (k === "order") drawCircle(ctx, f.color, [sx, sy], Math.trunc(4 + a * 12), 2);
      else if (k === "ifn") drawCircle(ctx, f.color, [sx, sy], Math.max(2, Math.trunc(f.r * (1 - a))), 2);
      else if (k === "text") {
        ctx.globalAlpha = a;
        this.text(f.text, this.f_small, f.color, sx, sy - Math.trunc((1 - a) * 18), "c");
        ctx.globalAlpha = 1;
      }
    }
  }
  drawGhost() {
    if (!this.build_key) return;
    const pos = input.mouse;
    if (!VIEW_RECT.collidepoint(...pos)) return;
    const key = this.build_key;
    const d = BUILDINGS[key];
    const [gx, gy] = this.ghostOrigin(...this.s2w(...pos), key);
    const [ok] = this.canPlace(key, gx, gy);
    const rect = new Rect(gx * TILE - Math.trunc(this.cam_x), gy * TILE - Math.trunc(this.cam_y) + TOP_H,
                          d.size * TILE, d.size * TILE);
    drawRect(ctx, ok ? css(d.color, 110 / 255) : "rgba(220,60,60,0.43)", rect);
    drawRect(ctx, ok ? WHITE : RED, rect, 2, 4);
    const wx = rect.centerx + this.cam_x, wy = rect.centery + this.cam_y - TOP_H;
    if (d.aura) this.drawRing(wx, wy, d.aura, [255, 185, 70]);
    if (d.boost) this.drawRing(wx, wy, d.boost, [225, 95, 110]);
    if (d.supply) {
      const n = this.vesselsTouching(gx, gy, d.size);
      let label, col;
      if (n) {
        const m = 0.6 + CAP_PER_VESSEL * Math.min(n, CAP_MAX_VESSELS);
        label = `+${(CAP_BASE.atp * m).toFixed(1)} ${RES_SHORT.atp}  +${(CAP_BASE.bio * m).toFixed(1)} ${RES_SHORT.bio} /s`;
        col = GREEN;
      } else { label = "Must touch a blood vessel"; col = RED; }
      const w = this.measure(label, this.f_small);
      drawRect(ctx, "rgba(10,6,12,0.7)", new Rect(rect.centerx - w / 2 - 6, rect.y - 23, w + 12, 20), 0, 5);
      this.text(label, this.f_small, col, rect.centerx, rect.y - 20, "c");
    }
  }

  // ============================ drawing: HUD =============================
  drawTopbar() {
    drawRect(ctx, PANEL, new Rect(0, 0, WIDTH, TOP_H));
    drawLine(ctx, PANEL_EDGE, [0, TOP_H - 1], [WIDTH, TOP_H - 1], 2);
    const resBlock = (x, label, val, rate, color) => {
      this.text(label, this.f_small, GREY, x, 4);
      const w = this.text(`${Math.trunc(val)}`, this.f_med, color, x, 18);
      if (rate !== null) this.text(`${fmtSigned(rate, 1)}/s`, this.f_small, rate >= 0 ? GREEN : RED, x + w + 6, 25);
    };
    resBlock(14, "Blood glucose", this.res.atp, this.rate.atp, YELLOW);
    resBlock(170, "Amino acids", this.res.bio, this.rate.bio, GREEN);
    resBlock(326, "Adaptation", this.ap, null, CYAN);
    this.text("Population", this.f_small, GREY, 430, 4);
    const pc = this.pop() >= this.pop_cap ? ORANGE : WHITE;
    this.text(`${this.pop()}/${this.pop_cap}`, this.f_med, pc, 430, 18);
    this.text(`${this.workers.length} tissue  ${this.units.length} immune`, this.f_small, GREY, 500, 25);

    let msg, col;
    if (this.demo_wave) {
      msg = `PRACTICE: ${this.virions.length + this.spawn_queue.length} virus`;
      col = ORANGE;
    } else if (this.tut && !this.wave_active) {
      msg = "Tutorial - no waves yet"; col = CYAN;
    } else if (this.wave_active) {
      const inf = this.infectedCells().length;
      const free = this.virions.length + this.spawn_queue.length;
      const bac = this.bacteria.length + this.bact_queue.length;
      msg = bac ? `Wave ${this.wave}: ${free} virus, ${inf} infected, ${bac} bacteria`
                : `Wave ${this.wave}: ${free} virus, ${inf} infected`;
      col = RED;
    } else {
      msg = `Wave ${this.wave + 1}`;
      col = WHITE;
    }
    this.text(msg, this.wave_active ? this.f_bold : this.f_med, col, 775, this.wave_active ? 14 : 12, "c");
    if (this.starving) this.text("STARVING", this.f_bold, RED, 775, 30, "c");

    const x = 920;
    this.button([x, 9, 34, 30], "II", () => { this.paused = !this.paused; }, this.paused ? "on" : "normal");
    for (const i of [1, 2, 3]) {
      this.button([x + 4 + i * 38, 9, 34, 30], ">".repeat(i), () => { this.speed = i; this.paused = false; },
                  this.speed === i && !this.paused ? "on" : "normal", true, this.f_small);
    }
    const bw = 140, bx = WIDTH - 154;
    drawRect(ctx, [50, 20, 26], new Rect(bx, 22, bw, 14), 0, 4);
    const pct = clamp(this.core.hp / this.core.max_hp, 0, 1);
    const c = pct > 0.5 ? GREEN : (pct > 0.25 ? YELLOW : RED);
    if (pct > 0) drawRect(ctx, c, new Rect(bx, 22, Math.trunc(bw * pct), 14), 0, 4);
    this.text(`${this.medical ? "Lymph node" : "Core"} ${Math.trunc(Math.max(0, this.core.hp))}/${Math.trunc(this.core.max_hp)}`,
              this.f_small, WHITE, bx, 4);
  }
  setTab(t) { this.tab = t; this.build_key = null; }

  drawBottombar() {
    const y0 = HEIGHT - BOTTOM_H;
    drawRect(ctx, PANEL, new Rect(0, y0, WIDTH, BOTTOM_H));
    drawLine(ctx, PANEL_EDGE, [0, y0], [WIDTH, y0], 2);

    TAB_ORDER.forEach((t, i) => {
      this.button([10, y0 + 10 + i * 39, 100, 34], t.toUpperCase(), () => this.setTab(t),
                  this.tab === t ? "on" : "normal", true, this.f_small);
    });

    let hovered = null;
    TABS[this.tab].forEach((key, i) => {
      const d = BUILDINGS[key];
      const rect = new Rect(120 + i * 136, y0 + 10, 130, 114);
      const afford = this.canAfford(d.cost);
      if (!this.unlocked(key)) {
        drawRect(ctx, [32, 28, 38], rect, 0, 8);
        drawRect(ctx, [70, 62, 80], rect, 2, 8);
        this.drawPadlock(rect.centerx, rect.y + 34);
        this.text(`[${i + 1}]`, this.f_small, [90, 84, 100], rect.right - 8, rect.y + 6, "r");
        this.text("Locked", this.f_bold, [140, 132, 150], rect.centerx, rect.y + 62, "c");
        this.text(`After wave ${UNLOCK_AT[key]}`, this.f_small, ORANGE, rect.centerx, rect.y + 84, "c");
        this.click_targets.push([rect, () => this.selectBuild(key)]);
        return;
      }
      let bg = this.build_key === key ? [70, 92, 116] : PANEL_LIGHT;
      if (rect.collidepoint(...input.mouse)) { hovered = key; bg = bg.map(c => Math.min(255, c + 16)); }
      drawRect(ctx, bg, rect, 0, 8);
      drawRect(ctx, d.color, rect, 2, 8);
      const ic = [rect.x + 22, rect.y + 24];
      if (d.unit || key === "helper") drawCellSprite(ctx, d.unit || "helper", ic[0], ic[1] + 2, 11, { still: true });
      else drawRect(ctx, d.color, new Rect(ic[0] - 10, ic[1] - 10, 20, 20), 0, 5);
      this.text(`[${i + 1}]`, this.f_small, GREY, rect.right - 8, rect.y + 6, "r");
      this.wrap(this.name(d), this.f_small, 118).slice(0, 2).forEach((line, li) =>
        this.text(line, this.f_small, WHITE, rect.x + 8, rect.y + 44 + li * 16));
      this.text(costStr(d.cost), this.f_small, afford ? YELLOW : RED, rect.x + 8, rect.bottom - 24);
      this.click_targets.push([rect, () => this.selectBuild(key)]);
    });

    const wx = 120 + 5 * 136 + 4;
    this.drawImmuneStatus(new Rect(wx, y0 + 10, WIDTH - MM_W - 24 - wx, 114));

    const mr = this.minimapRect();
    ctx.drawImage(this.map, mr.x, mr.y, MM_W, MM_H);
    const sc = MM_W / WORLD_W;
    for (const b of this.buildings) {
      drawRect(ctx, b.strain ? INFECT : b.d.color,
               new Rect(mr.x + b.gx * TILE * sc, mr.y + b.gy * TILE * sc,
                        Math.max(2, b.size * TILE * sc), Math.max(2, b.size * TILE * sc)));
    }
    ctx.fillStyle = css(CYAN);
    for (const u of this.units) ctx.fillRect(Math.trunc(mr.x + u.x * sc), Math.trunc(mr.y + u.y * sc), 1, 1);
    for (const w of this.workers)
      if (w.strain) drawCircle(ctx, INFECT, [Math.trunc(mr.x + w.x * sc), Math.trunc(mr.y + w.y * sc)], 2);
    ctx.fillStyle = css(RED);
    for (const v of this.virions) ctx.fillRect(mr.x + v.x * sc - 1, mr.y + v.y * sc - 1, 2, 2);
    ctx.fillStyle = css(BACT_COLOR);
    for (const v of this.bacteria) ctx.fillRect(mr.x + v.x * sc - 1, mr.y + v.y * sc - 1, 2, 2);
    ctx.fillStyle = css([200, 50, 110]);
    for (const c of this.cancers) ctx.fillRect(mr.x + c.x * sc - 1, mr.y + c.y * sc - 1, 3, 3);
    const idxs = this.wave_active ? this.active_entries : this.next_entries;
    for (const i of idxs) {
      const e = this.entries[i];
      drawCircle(ctx, RED, [Math.trunc(mr.x + e.x * sc), Math.trunc(mr.y + e.y * sc)], 4, 1);
    }
    drawRect(ctx, WHITE, new Rect(mr.x + this.cam_x * sc, mr.y + this.cam_y * sc, VIEW_W * sc, VIEW_H * sc), 1);
    drawRect(ctx, PANEL_EDGE, mr, 1);
    this.click_targets.push([mr, () => this.startMinimapDrag()]);

    if (hovered) this.drawTooltip(hovered);
  }

  /** Bottom panel: what the virus is doing and where the adaptive response is. */
  drawImmuneStatus(box) {
    drawRect(ctx, [34, 26, 38], box, 0, 8);
    drawRect(ctx, [110, 60, 90], box, 2, 8);
    const x = box.x + 10, y = box.y + 6;
    if (this.cancer_seeded) {
      this.text("Your own cells are dividing", this.f_bold, [230, 80, 130], x, y);
      this.text("out of control!", this.f_bold, [230, 80, 130], x, y + 20);
      this.text(`Rogue cells: ${this.cancers.length}`, this.f_small, ORANGE, x, y + 46);
      if (this.cancer_immune) this.text("SWAT cells switched off!", this.f_small, RED, x, y + 64);
      else this.text(`Round ${this.cancer_round + 1} - hiding from SWAT`, this.f_small, GREY, x, y + 64);
    } else if (this.wave_active && this.cur_strain) {
      const s = this.cur_strain;
      const ag = s.antigen;
      const tag = { drift: " (drifted)", shift: " (NEW - shift)" }[s.change] || "";
      this.text(`Strain ${ag}${tag}`, this.f_bold, s.color, x, y);
      const st = this.antigens.get(ag);
      let line, col;
      if (!st) { line = "Adaptive: not started - a Dendritic Cell must bring antigen"; col = ORANGE; }
      else if (st.state === "learning") {
        line = `Adaptive: activating, ${Math.trunc(st.t)}s` + (this.helpFactor() < 2 ? "" : " (no Helper T: slow)");
        col = CYAN;
      } else if (st.state === "active") { line = "Adaptive: ACTIVE - CD8 T cells & antibodies"; col = GREEN; }
      else { line = "Adaptive: memory ready"; col = GREEN; }
      let ty = y + 22;
      for (const ln of this.wrap(line, this.f_small, box.w - 20).slice(0, 2)) {
        this.text(ln, this.f_small, col, x, ty); ty += 16;
      }
      ty += 2;
      for (const trait of s.traits) {
        for (const ln of this.wrap(TRAIT_TEXT[trait], this.f_small, box.w - 20).slice(0, 2)) {
          if (ty < box.bottom - 16) this.text(ln, this.f_small, [230, 170, 220], x, ty);
          ty += 16;
        }
      }
      if (!s.traits.length) this.text("No special evasion tricks", this.f_small, GREY, x, ty);
    } else {
      this.text("Calm - no active infection", this.f_bold, WHITE, x, y);
      const mem = [...this.antigens].filter(([, v]) => v.state === "memory").map(([k]) => k);
      this.text("Immune memory: " + (mem.length ? mem.join(", ") : "none yet"), this.f_small, GREEN, x, y + 22);
      const names = this.next_entries.map(i => this.entries[i].name).join(", ");
      this.wrap(`Next virus enters from: ${names}`, this.f_small, box.w - 120).slice(0, 2).forEach((line, li) =>
        this.text(line, this.f_small, ORANGE, x, y + 42 + li * 16));
      this.button([box.right - 110, box.bottom - 38, 100, 30], "Call now [N]",
                  () => this.callWaveEarly(), "danger", true, this.f_small);
    }
  }

  drawTooltip(key) {
    const d = BUILDINGS[key];
    const lines = this.wrap(d.desc, this.f_small, 300);
    const who = d.unit || (key === "helper" ? "helper" : null);
    if (who) lines.push("Uniform: " + OUTFIT[who]);
    const h = 54 + 16 * lines.length;
    const r = new Rect(120, HEIGHT - BOTTOM_H - h - 8, 324, h);
    drawRect(ctx, [24, 20, 30], r, 0, 8);
    drawRect(ctx, d.color, r, 2, 8);
    this.text(this.name(d), this.f_bold, WHITE, r.x + 12, r.y + 8);
    this.text(`Cost: ${costStr(d.cost)}`, this.f_small, YELLOW, r.x + 12, r.y + 30);
    let y = r.y + 48;
    for (const line of lines) { this.text(line, this.f_small, [215, 210, 225], r.x + 12, y); y += 16; }
  }

  drawInfoPanel() {
    const selUnits = this.units.filter(u => u.selected);
    const b = this.sel_building, w = this.sel_worker;
    if (!(b || w || selUnits.length)) return;
    const r = new Rect(WIDTH - 316, TOP_H + 10, 306, 0);
    const lines = [], buttons = [];
    const S = this.f_small;
    if (b) {
      const d = b.d;
      lines.push([this.name(d), this.f_med, WHITE]);
      if (b.strain) {
        lines.push([`INFECTED by Strain ${b.strain.antigen} - ${Math.trunc(b.infection)}%`, this.f_bold, INFECT]);
        lines.push(["The virus hijacked these cells: no work, only virus.", S, INFECT]);
        lines.push(["NK / CD8 T cells must destroy it (costs some tissue).", S, GREY]);
      } else if (b.antiviral > 0) {
        lines.push(["Antiviral state (interferon): hard to infect", S, IFN_COL]);
      }
      if (!b.built)
        lines.push([`Blueprint - ${Math.trunc(100 * b.progress / d.work)}% built ` +
                    `(${b.builders} worker${b.builders !== 1 ? "s" : ""})`, S, CYAN]);
      lines.push([`Health ${Math.trunc(b.hp)}/${Math.trunc(b.max_hp)}`, S, GREEN]);
      if (d.supply && b.built && !b.strain) {
        const m = this.supplyMult(b);
        lines.push([`Touches ${b.vessels} vessel tile${b.vessels !== 1 ? "s" : ""}` +
                    (this.boosted(b) ? " + arteriole boost" : ""), S, WHITE]);
        lines.push([`Delivering +${(CAP_BASE.atp * m).toFixed(1)} glucose, ` +
                    `+${(CAP_BASE.bio * m).toFixed(1)} amino acids /s`, S, YELLOW]);
      }
      for (const line of this.wrap(d.desc, S, 280)) lines.push([line, S, [215, 210, 225]]);
      if (b === this.core) {
        lines.push([`Auto-grow keeps ${this.worker_target} worker cells`, S, WHITE]);
        buttons.push([`Grow worker (${costStr(GROW_COST)}) [G]`, () => this.growWorker(), "primary"]);
        buttons.push([`Auto-grow: ${this.auto_grow ? "ON" : "OFF"}`, () => { this.auto_grow = !this.auto_grow; },
                      this.auto_grow ? "on" : "normal"]);
        buttons.push(["Target workers  -", () => this.adjTarget(-1), "normal"]);
        buttons.push(["Target workers  +", () => this.adjTarget(1), "normal"]);
      } else if (!b.strain) {
        if (d.unit && b.built) lines.push(["Right-click the map to set a rally point.", S, GREY]);
        if (b.built && (d.unit || d.produce || d.supply))
          buttons.push([`Production: ${b.enabled ? "ON" : "OFF"}`, () => { b.enabled = !b.enabled; },
                        b.enabled ? "on" : "normal"]);
        buttons.push([b.built ? "Demolish (50% refund) [Del]" : "Cancel blueprint", () => this.demolish(b), "danger"]);
      }
    } else if (w) {
      lines.push([this.name(WORKER_DEF), this.f_med, WHITE]);
      lines.push(["Uniform: " + OUTFIT.worker, S, YELLOW]);
      lines.push([w.status(this.medical), S, w.strain ? INFECT : YELLOW]);
      if (w.antiviral > 0 && !w.strain) lines.push(["Antiviral state (interferon): hard to infect", S, IFN_COL]);
      lines.push(["Builders pick their own jobs: build > repair.", S, GREY]);
    } else {
      lines.push([`${selUnits.length} immune cell${selUnits.length !== 1 ? "s" : ""} selected`, this.f_med, WHITE]);
      const counts = {};
      for (const u of selUnits) counts[u.key] = (counts[u.key] || 0) + 1;
      for (const [k, c] of Object.entries(counts)) {
        lines.push([`${c} x ${this.name(CELL_TYPES[k])}`, S, CELL_TYPES[k].color]);
        for (const line of this.wrap("Uniform: " + OUTFIT[k], S, 270)) lines.push(["   " + line, S, YELLOW]);
        for (const line of this.wrap(CELL_TYPES[k].desc, S, 270)) lines.push(["   " + line, S, GREY]);
      }
      lines.push(["Right-click: move there and guard.", S, WHITE]);
      lines.push(["Right-click a target: focus it.", S, WHITE]);
    }
    r.h = 16 + lines.reduce((s, [, f]) => s + f.h + 2, 0) + buttons.length * 36;
    drawRect(ctx, "rgba(24,20,30,0.92)", r);
    drawRect(ctx, PANEL_EDGE, r, 2, 8);
    let y = r.y + 8;
    for (const [t, f, c] of lines) { this.text(t, f, c, r.x + 12, y); y += f.h + 2; }
    for (const [label, action, style] of buttons) {
      this.button([r.x + 10, y + 2, r.w - 20, 30], label, action, style, true, S);
      y += 36;
    }
  }
  adjTarget(d) { this.worker_target = clamp(this.worker_target + d, 0, 40); }

  drawAlerts() {
    let y = TOP_H + 10;
    for (const [msg, col, t] of this.alerts) {
      const w = this.measure(msg, this.f);
      const a = clamp(t / 1.0, 0, 1);
      drawRect(ctx, `rgba(10,6,12,${(170 / 255) * a})`, new Rect(10, y, w + 16, this.f.h + 6));
      ctx.globalAlpha = a;
      this.text(msg, this.f, col, 18, y + 3);
      ctx.globalAlpha = 1;
      y += this.f.h + 10;
    }
  }
  drawOffscreenArrows() {
    const idxs = this.wave_active ? this.active_entries : this.next_entries;
    const cx = VIEW_W / 2, cy = TOP_H + VIEW_H / 2;
    for (const i of idxs) {
      const e = this.entries[i];
      const [sx, sy] = this.w2s(e.x, e.y);
      if (this.visible(sx, sy, -10)) continue;
      const ang = Math.atan2(sy - cy, sx - cx);
      const ex = clamp(cx + Math.cos(ang) * 2000, 24, VIEW_W - 24);
      const ey = clamp(cy + Math.sin(ang) * 2000, TOP_H + 24, TOP_H + VIEW_H - 24);
      drawPoly(ctx, RED, [[ex + Math.cos(ang) * 14, ey + Math.sin(ang) * 14],
                          [ex + Math.cos(ang + 2.5) * 12, ey + Math.sin(ang + 2.5) * 12],
                          [ex + Math.cos(ang - 2.5) * 12, ey + Math.sin(ang - 2.5) * 12]]);
    }
  }
  drawHints() {
    if (this.tut) {
      if (this.paused) this.text("PAUSED  (SPACE to resume)", this.f_med, YELLOW, VIEW_W / 2, TOP_H + VIEW_H - 40, "c");
      return;
    }
    const msg = this.build_key
      ? "Left-click to place (hold & drag for barriers)   Right-click / ESC to cancel"
      : "WASD pan  -  drag to select cells  -  right-click to order  -  SPACE pause  -  " +
        "TAB build menu  -  F select all  -  H home  -  M terms";
    const w = this.measure(msg, this.f_small);
    const x = Math.floor((VIEW_W - w) / 2), y = TOP_H + VIEW_H - 22;
    drawRect(ctx, "rgba(10,6,12,0.6)", new Rect(x - 7, y - 2, w + 14, 20));
    this.text(msg, this.f_small, [190, 180, 200], x, y);
    if (this.paused) this.text("PAUSED  (SPACE to resume)", this.f_med, YELLOW, VIEW_W / 2, TOP_H + 14, "c");
  }
  drawGame() {
    drawRect(ctx, BG, new Rect(0, 0, WIDTH, HEIGHT));
    this.drawWorld();
    this.drawOffscreenArrows();
    this.drawAlerts();
    this.drawHints();
    this.drawTopbar();
    this.drawBottombar();
    this.drawInfoPanel();
    if (this.tut && this.state === "PLAYING") this.drawTutorial();
  }

  // =========================== drawing: menus ============================
  newBlob(x) {
    const kind = R.choice(["neutrophil", "macrophage", "dendritic", "nk", "killer_t", "bcell",
                           "helper", "worker", "virion", "virion", "virion"]);
    return {
      x: x !== undefined ? x : WIDTH + 30, y: R.uniform(0, HEIGHT),
      vx: -R.uniform(15, 50), r: Math.round(R.uniform(7, 18)), kind,
      col: R.choice(Object.values(FAMILY_COLORS)),
      rot: R.uniform(0, 6), flip: R.random() < 0.5,
    };
  }
  drawMenuBg(dt) {
    drawRect(ctx, BG, new Rect(0, 0, WIDTH, HEIGHT));
    for (const b of this.menu_blobs) {
      b.x += b.vx * dt; b.rot += dt;
      if (b.x < -40) Object.assign(b, this.newBlob());
      drawCellSprite(ctx, b.kind, b.x, b.y, b.r,
                     { t: this.time, phase: b.rot * 3, rot: b.rot, color: b.col, alpha: 0.33, flip: !b.flip });
    }
  }
  dim(alpha = 170) { drawRect(ctx, `rgba(8,4,10,${alpha / 255})`, new Rect(0, 0, WIDTH, HEIGHT)); }
  panel(rect) {
    drawRect(ctx, [28, 23, 34], rect, 0, 14);
    drawRect(ctx, PANEL_EDGE, rect, 2, 14);
  }
  drawMenu(dt) {
    this.drawMenuBg(dt);
    const bob = Math.sin(this.time * 1.5) * 4;
    this.text("Play BIO", this.f_title, [25, 12, 30], WIDTH / 2 + 4, 104 + bob, "c");
    this.text("Play BIO", this.f_title, WHITE, WIDTH / 2, 100 + bob, "c");
    this.text(tr("Run a colony of living cells. Fight a virus the way your body really does."),
              this.f, [200, 190, 215], WIDTH / 2, 192, "c");
    const bx = WIDTH / 2 - 140, by = 260, bw = 280, bh = 54;
    const items = [["Play", () => this.play(), "primary"],
                   ["Learn", () => this.go("LEARN"), "normal"],
                   ["Tutorial", () => this.startTutorial(), this.tut_done ? "normal" : "on"],
                   ["Settings", () => this.go("OPTIONS"), "normal"]];
    items.forEach(([label, action, style], i) =>
      this.button([bx, by + i * 66, bw, bh], tr(label), action, style, true, this.f_med));
    this.text(`${tr("Difficulty")}: ${tr(this.difficulty)}    ${tr("Terms")}: ${tr(this.medical ? "Medical" : "Simple")}`,
              this.f_small, GREY, WIDTH / 2, HEIGHT - 70, "c");
    this.text(tr("Best played with a mouse and keyboard."), this.f_small, GREY, WIDTH / 2, HEIGHT - 50, "c");
    this.text(tr("Cell art drawn in code - roles based on notes from the book \"Immune\""),
              this.f_small, [110, 102, 124], WIDTH / 2, HEIGHT - 30, "c");
  }
  // =========================== drawing: Learn ===========================
  drawPadlock(x, y) {
    drawArc(ctx, [150, 142, 160], new Rect(x - 8, y - 14, 16, 18), 0, Math.PI, 3);
    drawRect(ctx, [150, 142, 160], new Rect(x - 11, y - 4, 22, 16), 0, 3);
    drawCircle(ctx, [40, 34, 46], [x, y + 3], 2.5);
  }
  /** Icon for an Encyclopedia entry, fitting a box of size s centred on (x, y). */
  drawLearnIcon(e, x, y, s) {
    const t = this.time;
    if (e.icon === "sprite") {
      // the bacterium's tail makes it ~4.3 radii long, so it is drawn smaller and shifted to centre the whole shape
      const k = e.key === "macrophage" ? 0.3 : e.key === "bacterium" ? 0.12 : e.key === "worker" || e.key === "virion" ? 0.24 : 0.28;
      const r = Math.round(s * k), dx = e.key === "bacterium" ? r * 0.85 : 0;
      drawCellSprite(ctx, e.key, x + dx, y + s * 0.04, r, { t, phase: x * 0.01, color: FAMILY_COLORS.A });
    } else if (e.icon === "building") this.scIcon(e.key, x, y, Math.round(s * 0.8));
    else if (e.icon === "core") this.scCore(x, y + s * 0.05, Math.round(s * 0.62));
    else if (e.icon === "antibody") {
      ctx.save(); ctx.lineCap = "round";
      for (let i = 0; i < 5; i++) {   // IgM: five antibodies joined at the butt
        const a = -Math.PI / 2 + i * TAU / 5 + t * 0.3;
        sprY(ctx, x + Math.cos(a) * s * 0.18, y + Math.sin(a) * s * 0.18, s * 0.12, a, [255, 200, 70], 0.45);
      }
      drawCircle(ctx, [150, 110, 230], [x, y], s * 0.08);
      ctx.restore();
    } else if (e.icon === "ifn") {
      const p = (t % 2) / 2;
      drawCircle(ctx, css(IFN_COL, 1 - p), [x, y], s * (0.1 + p * 0.35), 2);
      for (let i = 0; i < 9; i++) {
        const a = i * 2.4 + t * 0.4, d = s * (0.12 + (i % 3) * 0.1);
        const px = x + Math.cos(a) * d, py = y + Math.sin(a) * d;
        drawPoly(ctx, i % 2 ? [255, 190, 70] : [250, 140, 50], [[px, py - 4], [px + 4, py + 3], [px - 4, py + 3]]);
      }
    } else if (e.icon === "complement") {
      const cols = [[230, 90, 170], [250, 200, 70], [110, 170, 255], [120, 220, 130], [180, 120, 240]];
      for (let i = 0; i < 16; i++) {
        const a = i * 2.39996, d = s * 0.3 * Math.sqrt((i + 0.5) / 16);
        drawCircle(ctx, cols[i % cols.length], [x + Math.cos(a + t * 0.2) * d, y + Math.sin(a + t * 0.2) * d], s * 0.035 + (i % 3));
      }
    }
  }
  learnGameText(e) {
    if (e.game) return e.game;
    if (e.def && e.def.desc) return e.def.desc;
    return BUILDINGS[e.build] ? BUILDINGS[e.build].desc : "";
  }
  drawLearn(dt) {
    this.drawMenuBg(dt);
    const r = new Rect(40, 24, WIDTH - 80, HEIGHT - 48);
    this.panel(r);
    this.text(tr("ENCYCLOPEDIA"), this.f_big, WHITE, r.centerx, r.y + 14, "c");
    if (this.learn_entry) { this.drawLearnEntry(this.learn_entry, r); return; }
    LEARN_TABS.forEach((tab, i) => {
      this.button([r.x + 30 + i * 170, r.y + 74, 158, 42], tr(tab.toUpperCase()), () => { this.learn_tab = tab; },
                  this.learn_tab === tab ? "on" : "normal", true, this.f_bold);
    });
    this.button([r.right - 210, r.y + 74, 180, 42], tr("How to Play"), () => this.go("HOWTO"), "primary", true, this.f_bold);
    const items = ENCYCLOPEDIA.filter(e => e.tab === this.learn_tab);
    const cols = 4, gap = 16, tw = Math.floor((r.w - 60 - gap * (cols - 1)) / cols), th = 150;
    items.forEach((e, i) => {
      const tile = new Rect(r.x + 30 + (i % cols) * (tw + gap), r.y + 134 + Math.floor(i / cols) * (th + gap), tw, th);
      const hover = tile.collidepoint(...input.mouse);
      drawRect(ctx, hover ? [54, 46, 64] : [34, 28, 40], tile, 0, 12);
      drawRect(ctx, hover ? YELLOW : PANEL_EDGE, tile, 2, 12);
      this.drawLearnIcon(e, tile.x + 64, tile.y + th / 2, 110);
      const tx = tile.x + 128, w = tile.w - 138;
      let y = tile.y + 26;
      for (const ln of this.wrap(e.def.simple, this.f_bold, w).slice(0, 2)) { this.text(ln, this.f_bold, WHITE, tx, y); y += 21; }
      for (const ln of this.wrap(e.def.medical, this.f_small, w).slice(0, 3)) { this.text(ln, this.f_small, [170, 162, 186], tx, y); y += 17; }
      this.text(tr("Read >"), this.f_small, hover ? YELLOW : CYAN, tx, tile.bottom - 24);
      this.click_targets.push([tile, () => { this.learn_entry = e; }]);
    });
    this.text(trf("learnCount", `${items.length} entries - click one to learn about it.  Terms: `, items.length) +
              `${tr(this.medical ? "Medical" : "Simple")} [M]`,
              this.f_small, GREY, r.centerx, r.bottom - 92, "c");
    this.button([r.centerx - 100, r.bottom - 66, 200, 48], tr("Back"), () => { this.state = "MENU"; }, "normal", true, this.f_med);
